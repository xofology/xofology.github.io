function migrateState(s){
  const num=v=>typeof v==='number'&&isFinite(v),clamp=v=>Math.max(0,Math.min(100,v));
  const legacy=num(s.cleanliness)?clamp(s.cleanliness):100;   // old single stat
  const seed=Math.max(50,legacy);                              // never start an old save in a punishing state

  s.waterClean=num(s.waterClean)?clamp(s.waterClean):seed;
  s.waterBuff=num(s.waterBuff)&&s.waterBuff>0?s.waterBuff:0;

function addFish(speciesId,variant=null,source='purchase'){const s=getSpecies(speciesId);if(!s)return null;const v=variant||variantRoll();const fish={uid:`f${Date.now().toString(36)}${Math.random().toString(36).slice(2,6)}`,species:speciesId,variant:v,x:120+Math.random()*710,y:120+Math.random()*260,vx:(Math.random()-.5)*35,vy:(Math.random()-.5)*18,phase:Math.random()*8,age:0,school:Math.random(),idleFor:0,nibbleTimer:0,value:s.price};state.fish.push(fish);state.totalFish++;state.totalDiscoveries++;const first=!state.discovered[speciesId];state.discovered[speciesId]=true;state.variantsFound[speciesId]=state.variantsFound[speciesId]||{Normal:false,Shiny:false,Golden:false,Albino:false,Iridescent:false,Shadow:false};state.variantsFound[speciesId][v]=true;checkAchievements();saveGame();if(first)toast('NEW SPECIES!',s.name+' added to your collection');if(v!=='Normal'){toast(`${v.toUpperCase()} DISCOVERY!`,`${s.name} · ${v} variant`);playSound('rare');}else if(first){playSound('rare');}else playSound('buy');return {fish,s,variant:v,first};}

 else if(s.shape==='eel'){px(3,13,31,7,a);px(1,14,6,4,b);px(30,12,5,6,a);px(33,11,6,8,b);px(37,12,5,5,a);}

 else { // general fish

 }

 else if(['mandarin-dragonet','clown-triggerfish','picasso-triggerfish','porcupine-pufferfish'].includes(s.id)){for(let i=0;i<5;i++)px(13+(i%3)*5,9+Math.floor(i/3)*7,2,2,b);}

function drawSprite(ctx,s,variant,x,y,scale=1,flip=false,t=0){const spr=makeSprite(s,variant);ctx.save();ctx.translate(x,y+Math.sin(t*2.2)*1.5);{const fl=typeof flip==='number'?flip:(flip?-1:1);if(fl!==1)ctx.scale(fl,1);}ctx.imageSmoothingEnabled=false;ctx.drawImage(spr,-24*scale,-16*scale,48*scale,32*scale);if(variant!=='Normal'&&state.settings.animations){const sparkle=((Math.floor(t*6)+s.name.length)%4);ctx.fillStyle=variant==='Golden'?'#fff1a0':variant==='Shadow'?'#84ffff':'#f7f6ff';ctx.fillRect((sparkle*7-11)*scale,-13*scale,2*scale,2*scale);}ctx.restore();}

function drawPlant(ctx,x,y,h,col,phase=0){ctx.fillStyle='#145e58';ctx.fillRect(x-2,y-h*.15,4,h*.15);for(let i=0;i<5;i++){const yy=y-h*(i+1)/6;const sway=Math.sin(phase+i*.65)*5;ctx.fillStyle=col;ctx.fillRect(x+sway,yy,4,Math.max(5,h/7));ctx.fillRect(x+sway-3,yy+4,4,Math.max(4,h/8));}}
function drawCoral(ctx,x,y,scale,col,phase){ctx.fillStyle=col;const p=(xx,yy,w,h)=>ctx.fillRect(x+xx*scale,y+yy*scale,w*scale,h*scale);p(-3,0,7,12);p(-8,-5+Math.sin(phase)*1,5,8);p(1,-8+Math.cos(phase)*1,5,11);p(6,-3,5,8);p(-1,-14,4,8);}

 // light shafts
 if(state.settings.animations){for(let i=0;i<6;i++){ctx.fillStyle=`rgba(177,255,239,${.025+Math.sin(t*.4+i)*.012})`;ctx.beginPath();ctx.moveTo(i*190+30,0);ctx.lineTo(i*190+110,0);ctx.lineTo(i*190+230,390);ctx.lineTo(i*190+150,390);ctx.fill();}}
 // distant reef silhouettes

 // gravel foreground + planted areas

 if(state.filterLevel>0){ctx.fillStyle='#16485a';ctx.fillRect(844,4,76,28);ctx.fillStyle='#4b8990';ctx.fillRect(850,7,64,7);ctx.fillStyle='#9adad0';ctx.fillRect(854,9,10,3);ctx.fillStyle='#0a283a';ctx.fillRect(850,17,64,12);for(let i=0;i<Math.min(5,state.filterLevel+1);i++){const bx=850+i*13,by=39+((t*25+i*17)%85);ctx.strokeStyle='rgba(180,255,246,.55)';ctx.strokeRect(bx,by,3,3);}}

function drawDecoration(ctx,id,x,y,t){if(id==='pink-coral'||id==='fan-coral'){drawCoral(ctx,x,y,id==='fan-coral'?2.6:1.9,id==='fan-coral'?'#d88cc5':'#ed8aa6',t+x);}else if(id==='blue-rock'){ctx.fillStyle='#667e89';ctx.fillRect(x-18,y-10,37,22);ctx.fillRect(x-12,y-17,23,8);ctx.fillStyle='#93adb0';ctx.fillRect(x-12,y-12,6,3);}else if(id==='anemone'){for(let i=0;i<8;i++){ctx.fillStyle=['#f7b5b0','#e88cb3','#f9d4a2'][i%3];ctx.fillRect(x-12+i*3,y-22+Math.sin(t*2+i)*3,2,24);}ctx.fillStyle='#e9c9a1';ctx.fillRect(x-13,y,27,5);}else if(id==='treasure'){ctx.fillStyle='#a46b35';ctx.fillRect(x-17,y-12,34,18);ctx.fillStyle='#e9c65e';ctx.fillRect(x-14,y-15,28,6);ctx.fillRect(x-2,y-7,4,5);}else if(id==='seaweed'){drawPlant(ctx,x,y,70,'#48aa77',t+x);}}

function updateFish(dt,t){for(let i=0;i<state.fish.length;i++){const f=state.fish[i],s=getSpecies(f.species);if(!s)continue;f.age=(f.age||0)+dt;f.idleFor=Math.max(0,(f.idleFor||0)-dt);f.nibbleTimer=Math.max(0,(f.nibbleTimer||0)-dt);const speed={dart:48,school:25,hover:13,bottom:17,cruise:29,seahorse:12,eel:20}[s.behavior]||25;
 if(f.idleFor<=0&&Math.random()<dt*.24){f.vx=(Math.random()-.5)*speed*1.2;f.vy=(Math.random()-.5)*speed*.5;if(s.behavior==='bottom'||s.behavior==='eel')f.vy=(Math.random()-.5)*6;if(s.behavior==='seahorse')f.vy=(Math.random()-.5)*22;}
 if(f.idleFor<=0&&Math.random()<dt*.035)f.idleFor=.35+Math.random()*.8;
 if(f.idleFor>0){f.vx*=Math.pow(.04,dt);f.vy*=Math.pow(.04,dt);}
 if(s.behavior==='school'){const others=state.fish.filter(o=>o!==f&&o.species===f.species);if(others.length){const near=others.reduce((best,o)=>Math.hypot(o.x-f.x,o.y-f.y)<Math.hypot(best.x-f.x,best.y-f.y)?o:best,others[0]);f.vx+=(near.x-f.x)*dt*.08;f.vy+=(near.y-f.y)*dt*.05;}}
 const targetX=f.x+f.vx*dt;let targetY=f.y+f.vy*dt;if(s.behavior==='bottom'||s.behavior==='eel')targetY=Math.max(340,Math.min(418,targetY));else if(s.behavior==='seahorse')targetY=Math.max(100,Math.min(360,targetY));else targetY=Math.max(90,Math.min(390,targetY));
 if(targetX<45||targetX>915)f.vx*=-1;if(targetY<65||targetY>420)f.vy*=-1;f.x=Math.max(35,Math.min(925,targetX));f.y=Math.max(65,Math.min(420,targetY));f.vx=Math.max(-speed,Math.min(speed,f.vx));f.vy=Math.max(-speed*.5,Math.min(speed*.5,f.vy));
 if(Math.abs(f.vx)>2.5)f.face=f.vx>0?1:-1;else if(!f.face)f.face=f.vx>0?1:-1;const tgt=f.face===1?-1:1;f.fs=f.fs===undefined?tgt:f.fs+(tgt-f.fs)*Math.min(1,dt*14);
 const nearDecor=state.placed.some(d=>Math.hypot(f.x-d.x*960,f.y-d.y*480)<62);if((f.y>365||nearDecor)&&Math.random()<dt*.09)f.nibbleTimer=.7;
 }}
function drawCondition(c,t){
  const tk=Math.max(0,Math.min(100,state.tankClean)),wt=Math.max(0,Math.min(100,state.waterClean));
  const wa=Math.max(0,(80-wt)/80);                       // water murk: appears below 80%
  if(wa>0){c.fillStyle=`rgba(112,128,52,${(wa*.34).toFixed(3)})`;c.fillRect(0,0,960,480);
    if(state.settings.animations){c.fillStyle='rgba(190,182,104,.5)';for(let i=0,n=Math.floor(wa*28);i<n;i++){const x=(i*131+Math.sin(t*.3+i)*14+960)%960,y=70+(i*53)%330+Math.sin(t*.5+i*1.7)*10;c.fillRect(Math.round(x),Math.round(y),3,3);}}}
  const ta=Math.max(0,(85-tk)/85);                       // glass algae: appears below 85%
  if(ta>0){for(let i=0,n=Math.floor(ta*56);i<n;i++){const x=((i*173+i*i*29)%240)*4,y=480-4*(((i*61)%(12+Math.floor(ta*60)))+1);const s=4*(2+i%4);c.fillStyle=`rgba(${58+i%3*8},${104+i%4*6},${48+i%3*6},${(.3+ta*.35).toFixed(2)})`;c.fillRect(x,y,s,s);}
    c.fillStyle=`rgba(60,104,50,${(ta*.3).toFixed(2)})`;for(let x=0;x<960;x+=24)c.fillRect(x,480-ta*56-((x/24)%3)*6,24,ta*56+((x/24)%3)*6);}
}
function renderTank(t){if(!tankCtx||!tankCanvas)return;const c=tankCtx;c.clearRect(0,0,960,480);drawScene(c,t);fishScreen=[];if(state.fish.length){const ordered=[...state.fish].sort((a,b)=>a.y-b.y);for(const f of ordered){const s=getSpecies(f.species);if(!s)continue;const scale=s.shape==='ray'?1.15:s.shape==='seahorse'?.88:s.shape==='eel'?.9:.9+(s.name.length%4)*.06;const wob=Math.sin(t*4+f.phase)*2+(f.idleFor>0?Math.sin(t*1.5+f.phase)*1.5:0);const sg=f.face===1?1:-1;drawSprite(c,s,f.variant,f.x,f.y+wob,scale,f.fs!==undefined?f.fs:(f.vx>0?-1:1),t+f.phase);if(f.nibbleTimer>0){c.fillStyle='rgba(218,255,242,.8)';c.fillRect(f.x+sg*14,f.y-17,3,3);c.fillRect(f.x+sg*19,f.y-23,2,2);}fishScreen.push({f,x:f.x,y:f.y,size:25*scale});}}else{c.fillStyle='rgba(220,255,245,.8)';c.font='18px VT323';c.fillText('Your reef is waiting for its first fish...',310,235);}
 // foreground fronds and bought objects occasionally overlap fish, giving them somewhere to hide.

}

function latestFishHtml(){const recent=state.fish.slice(-3).reverse();if(!recent.length)return '<p class="muted">No fish yet. Your first friend is waiting in the shop!</p>';return recent.map(f=>{const s=getSpecies(f.species);return `<div class="row" style="margin:6px 0"><canvas class="fishIcon" data-preview="${s.id}" data-variant="${f.variant}" width="56" height="38"></canvas><div><b>${s.name}</b><div class="tiny muted">${f.variant==='Normal'?'Normal':`✦ ${f.variant}`}</div></div></div>`}).join('');}
function nextMilestoneHtml(){const n=discoveredCount();const next=[5,10,20,30,40,50].find(x=>x>n)||50;return `<p><b>${n} / ${next}</b> species discovered</p><div class="progress"><i style="width:${Math.min(100,n/next*100)}%"></i></div><p class="tiny muted">Milestone reward: ${next===50?'The complete reef!':money(next*60)}</p>`;}
const bboxCache=new Map();
function spriteBox(s,variant){const k=s.id+'_'+variant;if(bboxCache.has(k))return bboxCache.get(k);const spr=makeSprite(s,variant),d=spr.getContext('2d').getImageData(0,0,48,32).data;let x0=48,y0=32,x1=-1,y1=-1;
for(let y=0;y<32;y++)for(let x=0;x<48;x++)if(d[(y*48+x)*4+3]>8){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
const b=x1<0?{x:0,y:0,w:48,h:32}:{x:x0,y:y0,w:x1-x0+1,h:y1-y0+1};bboxCache.set(k,b);return b;}
// Draws the visible artwork centred in W x H (flip: 1 native/left-facing, -1 mirrored); same logic for every species/variant.
function drawCentered(ctx,W,H,s,variant,flip=1,pad=8,maxScale=4){const b=spriteBox(s,variant);let sc=Math.min(maxScale,(W-pad*2)/b.w,(H-pad*2)/b.h);if(sc>=2)sc=Math.floor(sc);
ctx.save();ctx.imageSmoothingEnabled=false;ctx.translate(W/2,H/2);if(flip!==1)ctx.scale(flip,1);ctx.drawImage(makeSprite(s,variant),-(b.x+b.w/2)*sc,-(b.y+b.h/2)*sc,48*sc,32*sc);ctx.restore();}
function previewCanvases(){view.querySelectorAll('canvas[data-preview]').forEach(c=>{const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);drawCentered(ctx,c.width,c.height,getSpecies(c.dataset.preview),c.dataset.variant,1,5,2);});}

function renderDiscoveries(){const packages=[['Basic',180,'A gentle introduction to the reef. Mostly common fish, with a small chance of something special.'],['Premium',1200,'A better chance at Rare and Epic species, with a sliver of Legendary luck.'],['Deep Sea',2500,'A deep-water dive with real chances at Epic and Legendary finds.']].map(p=>[p[0],dc(p[1]),p[2]]);view.innerHTML=`<div class="tabPane"><div class="panel"><div class="sectionHead"><div><h2 class="panelTitle">03 / Mystery Discoveries</h2><div class="muted">Open a discovery package. Each fish gets its own independent variant roll.</div></div><span class="goldText">${money(state.money)}</span></div><div class="grid">${packages.map(([name,cost,desc],i)=>`<div class="card"><div class="pixel ${i===2?'legendary':i===1?'epic':'uncommon'}">${['STARTER DIVE','REEF EXPLORER','ABYSSAL VAULT'][i]}</div><h3 style="margin-top:10px">${name} Package</h3><p>${desc}</p><div class="row between" style="margin-top:12px"><b class="goldText">${money(cost)}</b><button class="primary small" data-pack="${name}" ${state.money>=cost&&hasFishSpace()?'':'disabled'}>Open</button></div></div>`).join('')}</div><p class="muted tiny" style="margin-top:12px">Packages can contain duplicates. Duplicates still earn income and may have a different variant.</p></div><div class="panel"><div class="sectionHead"><div><h2 class="panelTitle">Expedition Vessel</h2><div class="muted">Send a tiny crew to unexplored waters. Expeditions count down only while this game is running.</div></div><span class="badge">${state.expedition?'VESSEL AT SEA':'READY TO SAIL'}</span></div>${state.expedition?`<div class="notice"><b>${state.expedition.kind} expedition in progress.</b> Time remaining: <span id="expeditionTimer">${Math.ceil(state.expedition.remaining)}s</span><div class="progress" style="margin-top:8px"><i style="width:${100*(1-state.expedition.remaining/state.expedition.duration)}%"></i></div></div>`:`<div class="grid">${[['Coastal',200,45,'Common and unco function renderCollection(){const found=discoveredCount(),variantsCount=Object.values(state.variantsFound).reduce((n,o)=>n+Object.values(o).filter(Boolean).length,0);view.innerHTML=`<div class="panel tabPane"><div class="sectionHead"><div><h2 class="panelTitle">04 / Field Guide</h2><div class="muted">Your very own encyclopedia of the reef. Find all 50 species and collect their variants.</div></div><div class="pixel goldText">${found}/50 FOUND</div></div><div class="row" style="gap:18px;margin-bottom:13px"><div class="grow"><div class="row between"><b>Species collection</b><span>${Math.round(found/50*100)}%</span></div><div class="progress"><i style="width:${found/50*100}%"></i></div></div><div><b>${variantsCount}/300</b><div class="tiny muted">Variant records</div></div><div><b>${fishCount()}</b><div class="tiny muted">Fish owned</div></div></div><div class="filters"><input id="collectionSearch" placeholder="Search species..."><select id="collectionRarity"><option>All rarities</option>${Object.keys(RARITIES).map(r=>`<option>${r}</option>`).join('')}</select><select id="collectionStatus"><option>All species</option><option>Discovered</option><option>Undiscovered</option></select><select id="collectionVariant"><option>All variants</option>${Object.keys(VARIANTS).map(v=>`<option>${v}</option>`).join('')}</select></div><div id="collectionList" class="grid"></div></div>`;function fill(){const q=$('#collectionSearch').value.toLowerCase(),rar=$('#collectionRarity').value,st=$('#collectionStatus').value,v=$('#collectionVariant').value;const list=species.filter(s=>(!q||s.name.toLowerCase().includes(q))&&(rar==='All rarities'||s.rarity===rar)&&(st==='All species'||(st==='Discovered'?!!state.discovered[s.id]:!state.discovered[s.id]))&&(v==='All variants'||!!state.variantsFound[s.id]?.[v]));$('#collectionList').innerHTML=list.map(s=>{const known=!!state.discovered[s.id],variants=state.variantsFound[s.id]||{};const counts=Object.keys(VARIANTS).filter(k=>variants[k]).length;const let mg=null;
function closeMaint(){if(!mg)return;mg.cleanup&&mg.cleanup();mg=null;if(activeModal==='maint'){$('#modalRoot').innerHTML='';activeModal=null;}}
function finishMaint(apply,msg){if(!mg||mg.done)return;mg.done=true;const t=$('#mgMsg');if(t)t.textContent=msg;setTimeout(()=>{closeMaint();apply();},550);}
function openMaint(kind){
  if(activeModal)return;
  activeModal='maint';mg={kind,done:false,cleanup:null};
  const titles={feed:'FEED THE FISH',clean:'CLEAN THE GLASS',water:'REFRESH THE WATER'};
  const root=$('#modalRoot');
  root.innerHTML=`<div class="modalBack" id="maintBack"><div class="modal" style="user-select:none;-webkit-user-select:none"><div class="pixel goldText">✦ ${titles[kind]} ✦</div><div id="mgBody"></div><div class="mgHint" id="mgMsg"></div><button id="mgCancel" class="small">CANCEL</button></div></div>`;
  $('#maintBack').onpointerdown=e=>{if(e.target.id==='maintBack')closeMaint();};
  $('#mgCancel').onclick=closeMaint;
  ({feed:setupFeedGame,clean:setupCleanGame,water:setupWaterGame})[kind]($('#mgBody'),$('#mgMsg'));
}
function setupFeedGame(body,msg){
  const NEED=4;let n=0;
  body.innerHTML=`<div class="mgHint">Shake the pellet shaker ${NEED} times!</div><button class="shaker" id="shaker" aria-label="Shake the pellet shaker"><div class="shakerBody"></div></button><div class="pelletArea" id="pellets"></div><div class="mgPips">${Array.from({length:NEED},()=>'<i></i>').join('')}</div>`;
  const sh=$('#shaker'),area=$('#pellets'),pips=body.querySelectorAll('.mgPips i');
  sh.onclick=()=>{
    if(mg.done)return;n++;playSound('buy');
    sh.classList.remove('shake');void sh.offsetWidth;sh.classList.add('shake');
    for(let i=0;i<9;i++){const d=document.createElement('span');d.className='pellet';d.style.left=(30+Math.random()*40)+'%';d.style.animationDelay=(Math.random()*.15)+'s';area.appendChild(d);setTimeout(()=>d.remove(),1200);}
    pips.forEach((p,i)=>p.classList.toggle('on',i<n));
    msg.textContent=n<NEED?`${n} / ${NEED}`:'Yum!';
    if(n>=NEED)finishMaint(doFeed,'Yum!');
  };
  sh.focus();
}
function setupCleanGame(body,msg){
  const W=480,H=240;
  body.innerHTML=`<div class="mgHint">Drag to wipe the algae off the glass!</div><div class="wipeBox" id="wipeBox"><canvas class="bg" id="wipeBg" width="${W}" height="${H}"></canvas><canvas id="wipeDirt" width="${W}" height="${H}"></canvas></div><div class="progress" style="margin-top:12px;height:16px"><i id="wipeBar" style="width:0%"></i></div>`;
  const bg=$('#wipeBg').getContext('2d'),dc=$('#wipeDirt'),d=dc.getContext('2d',{willReadFrequently:true});
  bg.imageSmoothingEnabled=false;
  if(tankCanvas)bg.drawImage(tankCanvas,0,0,W,H);else{bg.fillStyle='#0a5b78';bg.fillRect(0,0,W,H);}
  // algae haze + blotches
  d.fillStyle='rgba(94,128,78,.82)';d.fillRect(0,0,W,H);
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let i=0;i<70;i++){d.fillStyle=`rgba(${60+rnd()*40|0},${95+rnd()*45|0},${50+rnd()*30|0},.5)`;const s=8+rnd()*22|0;d.fillRect(rnd()*W|0,rnd()*H|0,s,s);}
  for(let i=0;i<24;i++){d.fillStyle='rgba(40,70,40,.55)';d.fillRect(rnd()*W|0,rnd()*H|0,4,4);}
  const COLS=24,ROWS=12;let last=null,down=false,lastCheck=0;
  const pt=e=>{const r=dc.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};};
  function wipe(a,b){d.globalCompositeOperation='destination-out';d.lineCap='round';d.lineJoin='round';d.lineWidth=46;d.beginPath();d.moveTo(a.x,a.y);d.lineTo(b.x,b.y);d.stroke();d.globalCompositeOperation='source-over';}
  function coverage(){let clear=0;for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(d.getImageData((c+.5)*W/COLS|0,(r+.5)*H/ROWS|0,1,1).data[3]<40)clear++;}return clear/(COLS*ROWS);}
  function check(force){const now=performance.now();if(!force&&now-lastCheck<100)return;lastCheck=now;const cv=coverage();$('#wipeBar').style.width=Math.min(100,cv/.9*100)+'%';if(cv>=.9&&!mg.done){d.clearRect(0,0,W,H);$('#wipeBar').style.width='100%';finishMaint(doClean,'Sparkling!');}}
  const box=$('#wipeBox');
  box.onpointerdown=e=>{if(mg.done)return;down=true;box.setPointerCapture(e.pointerId);last=pt(e);wipe(last,last);check();e.preventDefault();};
  box.onpointermove=e=>{if(!down||mg.done)return;const p=pt(e);wipe(last,p);last=p;check();};
  const up=()=>{down=false;last=null;if(!mg.done)check(true);};
  box.onpointerup=up;box.onpointercancel=up;
}
function setupWaterGame(body,msg){
  const NEED=3.5;let prog=0,holding=false,raf=0,prev=performance.now();
  body.innerHTML=`<div class="mgHint">Press and hold the button for ${NEED.toFixed(1)} seconds to flush in fresh water.</div><button class="primary holdBtn" id="holdBtn">HOLD TO REFRESH</button><div class="progress holdBar"><i id="holdFill" style="width:0%"></i></div>`;
  const btn=$('#holdBtn'),fill=$('#holdFill');
  let activeId=null;
  const start=()=>{if(!mg.done)holding=true;},stop=()=>{holding=false;};
  btn.onpointerdown=e=>{activeId=e.pointerId;try{btn.setPointerCapture(e.pointerId);}catch(_){}start();e.preventDefault();};
  const release=e=>{if(e.pointerId===activeId){activeId=null;stop();}};
  btn.onpointerup=release;btn.onpointercancel=release;btn.onblur=stop;btn.oncontextmenu=e=>e.preventDefault();
  btn.onkeydown=e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){start();e.preventDefault();}};
  btn.onkeyup=e=>{if(e.key===' '||e.key==='Enter'){stop();e.preventDefault();}};
  btn.onclick=e=>e.preventDefault();
  function loop(now){const dt=Math.min(.1,(now-prev)/1000);prev=now;
    if(!mg||mg.done)return;
    if(holding)prog=Math.min(NEED,prog+dt);else prog=Math.max(0,prog-dt*1.5);
    fill.style.width=(prog/NEED*100)+'%';msg.textContent=holding?(prog<NEED?'Keep holding…':''):(prog>0?'Hold it! The water is draining back.':'');
    if(prog>=NEED){holding=false;playSound('coin');finishMaint(doWater,'Fresh water!');return;}
    raf=requestAnimationFrame(loop);}
  raf=requestAnimationFrame(loop);btn.focus();
  mg.cleanup=()=>cancelAnimationFrame(raf);
}

});

function openFishModal(uid,confirming=false){
  if(activeModal&&activeModal!=='fish')return;

  const s=getSpecies(f.species);if(!s)return;

    : `${infoHtml(s,variant)}<div class="row between" style="margin:10px 0;padding:8px 10px;background:#07354e;border:1px solid #1f7285"><span>Selling price (50% of original value ${money(fishValue(f))})</span><strong class="goldText">${money(price)}</strong></div><div class="row" style="justify-content:center"><button class="danger" id="sellFishBtn">SELL FISH</button><button id="closeFish">CLOSE</button></div>`;

  const c=$('#fishCanvas').getContext('2d');c.imageSmoothingEnabled=false;c.clearRect(0,0,180,110);drawCentered(c,180,110,s,variant,1,14,4);

  if(confirming){$('#confirmSell').onclick=()=>sellFish(uid);$('#cancelSell').onclick=()=>openFishModal(uid,false);}

function sellFish(uid){
  const idx=state.fish.findIndex(f=>f.uid===uid);if(idx<0){closeFishModal();return;}
  const f=state.fish[idx],s=getSpecies(f.species),price=sellPrice(f);
  if(state.fish.length===1&&state.money+price<CHEAPEST_FISH){toast('CANNOT SELL YET',"You'd be unable to afford another fish.");closeFishModal();return;}
  state.fish.splice(idx,1);            // discoveries, variantsFound, achievements deliberately untouched
  state.money+=price;                  // not added to lifetime earnings
  state.fishSold=(state.fishSold||0)+1;
  closeFishModal();saveGame();lastSave=Date.now();updateHud();
  toast('FISH SOLD',`${s?s.name:'Fish'} · +${money(price)}`);playSound('coin');
  if(currentTab==='aquarium'){updateAquariumLive();refreshFishLists();}else if(currentTab==='shop')updateShopLive();else if(currentTab==='statistics')render();
}

asse buries itself in sand to sleep safely.", "Reef fish visit dedicated cleaning stations where cleaner wrasses remove parasites from their bodies.", "Like many wrasses, the Christmas wrasse can change from female to male as it matures.", "Flame hawkfish perch on coral using strong pectoral fins, watching for small prey.", "Its beak-like fused teeth crush hard-shelled prey such as small crustaceans.", "When badly stressed, boxfish can release a toxin that may poison nearby fish.", "Unlike many morays, zebra morays have blunt teeth adapted for crushing crabs and molluscs.", "The male carries developing young in a brood pouch and gives birth when they are ready.", "Like seahorses, male pipefish carry developing eggs on a specialised brood surface.", "Triggerfish can lock a dorsal spine upright, wedging themselves safely into reef crevices.", "Strong jaws help this triggerfish crush hard-shelled invertebrates, including sea urchins and molluscs.", "Its vivid skin produces mucus and lacks the typical scales found on many fish.", "Sponges make up a major part of its natural diet, making this angelfish a specialist feeder.", "It grazes algae on coral reefs, using its narrow snout to reach growth on rock.", "Female bird wrasses can change sex, developing the male's distinctive bird-like beak and blue-green colouring.", "When threatened, it gulps water to swell up and make its spines stand out.", "Its box-shaped body is protected by bony plates, while long horns give it a distinctive silhouette.", "Its fan-like pectoral fins help herd prey, while venomous dorsal spines deter predators.", "Jawfish excavate and maintain burrows in sandy seabeds, retreating inside when danger approaches.", "Juveniles look so different from adults that emperor angelfish were once mistaken for a separate species.", "The Moorish idol is the only living species in its entire fish family, Zanclidae.", "Its long, venomous dorsal spines deter predators while broad fins help corner small fish.", "Rib el.className=l.ok?'ok':'bad';el.innerHTML=`<b>${l.ok?'EXPEDITION SUCCESSFUL':'EXPEDITION UNSUCCESSFUL'}</b><span>${l.kind}: ${l.text}</span><button class="small" id="expDismiss">Dismiss</button>`;$('#expDismiss').onclick=()=>{l.dismissed=true;saveGame();showExpBanner();};}
function setExpOutcome(kind,ok,text){state.lastExpedition={kind,ok,text,t:Date.now(),dismissed:false};showExpBanner();playSound(ok?'coin':'low');}
showExpBanner();

// ===== RESEARCH FACILITY =====
const RESEARCH_REQ={species:25,expeditions:3,lifetime:25000}, RESEARCH_MAX_ACTIVE=2;
const RESEARCH=[
{id:'survey',cat:'Undiscovered species',name:'Unknown Species Survey',desc:'Sample the water to identify a species you have not found. Rewards one undiscovered fish.',cost:3000,hours:1,r:'species'},
{id:'genome',cat:'Undiscovered species',name:'Genome Sequencing',desc:'A deeper analysis that identifies another undiscovered fish.',cost:12000,hours:6,r:'species'},
{id:'trench',cat:'Deep-sea research',name:'Trench Submersible',desc:'Unlocks the costly, risky Trench expedition (Legendary/Mythical finds or a fortune).',cost:20000,hours:12,r:'trench'},
{id:'reefcom',cat:'Multi-species project',name:'Reef Community Study',desc:'Requires discovering: Clownfish, Royal Gramma, Blue Tang, Mandarin Dragonet. +3% income.',cost:8000,hours:4,r:'bonus',val:.03,need:['clownfish','royal-gramma','blue-tang','mandarin-dragonet']},
{id:'angels',cat:'Multi-species project',name:'Angelfish Taxonomy',desc:'Requires discovering five angelfish species. +6% income.',cost:40000,hours:24,r:'bonus',val:.06,need:['coral-beauty','flame-angelfish','regal-angelfish','emperor-angelfish','watanabei-angelfish']},
{id:'inst',cat:'Facility upgrade',name:'Aquarium Instrumentation',desc:'Better sensors and filtration. +4% income.',cost:15000,hours:8,r:'bonus',val:.04},
{id:'deepinst',cat:'Facility upgrade',name:'Long-term Habitat Study',desc:'A multi-day study. +10% income.',cost:100000,hours:48,r:'bonus',val:.10}];
const researchReqsMet=()=>discoveredCount()>=RESEARCH_REQ.species&&(state.completedExpeditions||0)>=RESEARCH_REQ.expeditions&&state.lifetime>=RESEARCH_REQ.lifetime;
function researchTick(dt){const R=state.research;if(!R.unlocked&&researchReqsMet()){R.unlocked=true;toast('RESEARCH FACILITY UNLOCKED','A new Research tab is now open!');playSound('rare');if(currentTab==='research')render();}
let done=false;R.active.forEach(a=>{a.remaining-=dt;});const fin=R.active.filter(a=>a.remaining<=0);if(fin.length){fin.forEach(a=>{R.ready.push(a.id);toast('RESEARCH COMPLETE',RESEARCH.find(r=>r.id===a.id).name);playSound('rare');});R.active=R.active.filter(a=>a.remaining>0);saveGame();if(currentTab==='research')render();}
else if(currentTab==='research')R.active.forEach(a=>{const d=a.duration;setWidth('rsBar-'+a.id,100*(1-a.remaining/d));setText('rsT-'+a.id,fmtT(a.remaining));});}
function startResearch(id){const R=state.research,p=RESEARCH.find(r=>r.id===id);if(!p||!R.unlocked||R.done[id]||R.ready.includes(id)||R.active.some(a=>a.id===id)||R.active.length>=RESEARCH_MAX_ACTIVE||state.money<p.cost||(p.need&&!p.need.every(x=>state.discovered[x])))return;
state.money-=p.cost;const d=p.hours*3600*(1-.1*(state.prestige.up.rs||0));R.active.push({id,remaining:d,duration:d});saveGame();updateHud();render();}
function collectResearch(id){const R=state.research,p=RESEARCH.find(r=>r.id===id);if(!p||!R.ready.includes(id))return;
if(p.r==='species'){if(!hasFishSpace()){toast('TANK FULL','Make room before collecting.');return;}const pool=species.filter(s=>!state.discovered[s.id]&&!s.exclusive);if(pool.length){R.ready=R.ready.filter(x=>x!==id);R.done[id]=true;const f=addFish(pool[Math.floor(Math.random()*pool.length)].id);saveGame();showReveal(f,'Research');render();return;}addMoney(8000);toast('NOTHING LEFT TO FIND','Bonus grant: 8,000 shells.');}
if(p.r==='trench')R.done.trench=true;if(p.r==='bonus')R.bonus+=p.val;
R.ready=R.ready.filter(x=>x!==id);R.done[id]=true;saveGame();updateHud();toast('RESEARCH REWARD',p.name+' collected.');playSound('coin');render();}
function renderResearch(){const R=state.research;const reqs=[['Species discovered',discoveredCount(),RESEARCH_REQ.species],['Expeditions completed',state.completedExpeditions||0,RESEARCH_REQ.expeditions],['Lifetime earnings',Math.floor(state.lifetime),RESEARCH_REQ.lifetime]];
if(!R.unlocked){view.innerHTML=`<div class="tabPane panel"><h2 class="panelTitle">⚗ Research Facility — Locked</h2><p class="muted">A late-game laboratory. Reach these milestones to build it:</p>${reqs.map(([n,v,t])=>`<div class="row between"><span>${v>=t?'✓':'✗'} ${n}</span><b>${fmt(Math.min(v,t))} / ${fmt(t)}</b></div><div class="progress" style="margin-bottom:8px"><i style="width:${Math.min(100,100*v/t)}%"></i></div>`).join('')}</div>`;return;}
view.innerHTML=`<div class="tabPane panel"><div class="sectionHead"><div><h2 class="panelTitle">⚗ Research Facility</h2><div class="muted">Long projects (active ${R.active.length}/${RESEARCH_MAX_ACTIVE}). Timers only run while the game is open. Research bonus: +${Math.round(R.bonus*100)}% income.</div></div><span class="goldText">${money(state.money)}</span></div><div class="grid">${RESEARCH.map(p=>{const a=R.active.find(x=>x.id===p.id),rd=R.ready.includes(p.id),dn=R.done[p.id],need=p.need&&!p.need.every(x=>state.discovered[x]);
const dur=p.hours*3600*(1-.1*(state.prestige.up.rs||0));return `<div class="card"><div class="pixel">${p.cat.toUpperCase()}</div><h3>${p.name}</h3><p>${p.desc}</p><p class="tiny goldText">${money(p.cost)} · ${fmtT(dur)}</p>${a?`<div class="progress"><i id="rsBar-${p.id}" style="width:${100*(1-a.remaining/a.duration)}%"></i></div><div class="tiny">Remaining: <b id="rsT-${p.id}">${fmtT(a.remaining)}</b></div>`:rd?`<button class="small gold" data-rcollect="${p.id}">Collect reward</button>`:dn?'<span class="badge uncommon">✓ COMPLETE</span>':`<button class="small primary" data-rstart="${p.id}" ${state.money>=p.cost&&R.active.length<RESEARCH_MAX_ACTIVE&&!need?'':'disabled'}>${need?'Species missing':'Start research'}</button>`}</div>`}).join('')}</div></div>`;}
// ===== PRESTIGE =====
const PRESTIGE_REQ={earned:100000};
const runEarned=()=>Math.max(0,state.lifetime-state.prestige.base);
const prestigeTokens=()=>Math.floor(Math.sqrt(runEarned()/5000))+Math.floor(discoveredCount()/10);
const PUP=[{k:'inc',n:'Higher Yields',d:'+10% passive income per level',max:10,c:l=>2+l*2},{k:'cash',n:'Seed Money',d:'+500 starting shells per level',max:10,c:l=>1+l},{k:'disc',n:'Trade Contacts',d:'-5% discovery & expedition costs per level',max:5,c:l=>3+l*2},{k:'cap',n:'Reef Expansion',d:'+2 permanent fish capacity per level',max:5,c:l=>4+l*3},{k:'rs',n:'Lab Efficiency',d:'-10% research time per level',max:3,c:l=>3+l*2}];
function buyPUp(k){const u=PUP.find(x=>x.k===k),P=state.prestige,l=P.up[k]||0;if(!u||l>=u.max||P.tokens<u.c(l))return;P.tokens-=u.c(l);P.up[k]=l+1;saveGame();render();}
function renderPrestige(){const P=state.prestige,run=runEarned(),ok=run>=PRESTIGE_REQ.earned,est=prestigeTokens();
view.innerHTML=`<div class="tabPane panel"><div class="sectionHead"><div><h2 class="panelTitle">★ Aquarium Prestige</h2><div class="muted">Start a fresh aquarium in return for permanent rewards. Always optional.</div></div><span class="goldText">Level ${P.level} · ${P.tokens} tokens</span></div>
<div class="row between"><span>Progress this run</span><b>${fmt(Math.min(run,PRESTIGE_REQ.earned))} / ${fmt(PRESTIGE_REQ.earned)} shells earned</b></div><div class="progress" style="margin-bottom:10px"><i style="width:${Math.min(100,100*run/PRESTIGE_REQ.earned)}%"></i></div>
<div class="notice">Prestige now would earn <b>${ok?est:0} Prestige Tokens</b>${ok?'':' (requirement not met)'}. Each prestige level also gives +5% income.</div>
<p class="tiny"><b>Resets:</b> shells, fish, tank & filter upgrades, decorations, expedition. <b>Keeps:</b> discoveries, variants, achievements, statistics, research, tokens & permanent upgrades.</p>
<button class="gold" id="doPrestige" ${ok?'':'disabled'}>Prestige…</button></div>
<div class="tabPane panel"><h2 class="panelTitle">Permanent upgrades</h2><div class="grid">${PUP.map(u=>{const l=P.up[u.k]||0,c=u.c(l);return `<div class="card"><h3>${u.n}</h3><p>${u.d}</p><p class="tiny muted">Level ${l}/${u.max}</p><button class="small primary" data-pup="${u.k}" ${l<u.max&&P.tokens>=c?'':'disabled'}>${l>=u.max?'MAX':'Buy · '+c+' tokens'}</button></div>`}).join('')}</div></div>`;}
function openPrestigeConfirm(){if(activeModal)return;activeModal='fish';$('#modalRoot').innerHTML=`<div class="modalBack" id="fishBack"><div class="modal"><div class="pixel goldText">★ CONFIRM PRESTIGE ★</div><p>You will earn <b class="goldText">${prestigeTokens()} Prestige Tokens</b> (level ${state.prestige.level+1}).</p><p class="tiny"><b>RESET:</b> shells (to ${250+500*(state.prestige.up.cash||0)}), all fish (starter clownfish remains), tank/filter upgrades, decorations, current expedition.<br><b>KEPT:</b> discovered species & variants, achievements, lifetime stats, research, tokens, permanent upgrades.</p><div class="row" style="justify-content:center"><button class="danger" id="yesPrestige">PRESTIGE NOW</button><button id="closeFish">CANCEL</button></div></div></div>`;$('#closeFish').onclick=closeFishModal;$('#fishBack').onclick=e=>{if(e.target.id==='fishBack')closeFishModal();};$('#yesPrestige').onclick=performPrestige;}
function performPrestige(){if(runEarned()<PRESTIGE_REQ.earned)return;const P=state.prestige,t=prestigeTokens(),f=freshState();
['discovered','variantsFound','achievements','lifetime','totalFish','totalDiscoveries','playSeconds','fishSold','completedExpeditions','settings','research','lastExpedition'].forEach(k=>f[k]=state[k]);
f.prestige={level:P.level+1,tokens:P.tokens+t,base:state.lifetime,up:P.up};f.money=250+500*(P.up.cash||0);state=f;closeFishModal();saveGame();lastSave=Date.now();toast('PRESTIGE COMPLETE',`+${t} Prestige Tokens`);playSound('rare');render();}
$('#nav').insertAdjacentHTML('beforeend','<button data-tab="research">⚗ Research</button><button data-tab="prestige">★ Prestige</button><button data-tab="arena" class="arenaTab">⚔ Arena</button><button data-tab="settings">⚙ Settings</button>');
view.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.rstart)startResearch(b.dataset.rstart);if(b.dataset.rcollect)collectResearch(b.dataset.rcollect);if(b.dataset.pup)buyPUp(b.dataset.pup);if(b.id==='doPrestige')openPrestigeConfirm();});


// ===== ARENA (fully simulated: no servers, no real players) =====
const ARENA_NAMES="ReefKing AquaHunter CoralCrusher BubbleBandit DeepSeaDave FinWizard TankTitan ShellShocker BlueLagoon Fishmonger99 NeonNautilus AbyssWalker ShrimpLord JellyJester OceanPhantom ReefRider TidalWaveX CoralGoblin FishFrenzy KrakenMain AquaKnight FinFlicker BubbleTrouble SaltwaterSam MantaMode SeaSerpent TankDestroyer PlanktonPro GuppyGod BlueDepths CoralVortex ReefRogue FinCollector AnglerAce HydroHavoc ShellCollector OctoLegend TropicalTerror MarlinMode AquaSpectre DeepBlueDan FishyBusiness ReefRunner TetraTornado SeaDragonX BubbleKing CoralCrafter AbyssElite FinReaper OceanOverlord KoiCommander SaltwaterGhost NeonReef TankGoblin PufferPunk LeviathanX AquaPhantom ReefBandit StarfishSlayer CurrentChaser SeaWarden GillGamer CoralKingpin NautilusNerd AbyssalAce FishWhisperer TideTurner ReefBeast BubbleBrawler OceanNomad ClownfishCEO DeepDiveDan MantaMafia FinFighter LagoonLegend AquaVandal SharkSnack CoralPhantom SeaPickle ReefReaper NauticalNinja TankTycoon GhostGoby BlueFinBandit SquidSquad MarianasMain Fishzilla OceanGremlin TidalTitan CrustaceanKing ReefAddict SaltwaterVillain AquaMenace JellyfishEnjoyer AbyssalGoblin FinancialFreedom CoralAddict DeepSeaDealer BubbleEconomist LastFishStanding".split(' ');
const ARENA_SPIN_MS=5200;let arenaMatch=null,arenaTimer=0;
const fishWorth=()=>state.fish.reduce((n,f)=>n+fishValue(f),0);
const arenaWinPct=(w,o)=>w/(w+o)*100;
function arenaOpponent(worth){const last=state.arena.last;let name;do{name=ARENA_NAMES[Math.floor(Math.random()*ARENA_NAMES.length)];}while(name===last&&ARENA_NAMES.length>1);
const lo=Math.ceil(worth*.5),hi=Math.floor(worth*1.5);return {name,wealth:Math.min(hi,Math.max(lo,Math.round(worth*(.5+Math.random()))))};}
function newArenaMatch(){const worth=fishWorth();if(worth<=0){arenaMatch=null;return;}const o=arenaOpponent(worth);state.arena.last=o.name;arenaMatch={name:o.name,wealth:o.wealth,worth,p:arenaWinPct(worth,o.wealth),state:'ready',result:null};}
function arenaRoll(p){return Math.random()*100<p;}   // weighted outcome: decided BEFORE the animation
function arenaAngle(win,p){const w=p/100*360,m=.06;return win?w*m+Math.random()*w*(1-2*m):w+(360-w)*m+Math.random()*(360-w)*(1-2*m);}
function spinArena(){const m=arenaMatch;if(!m||m.state!=='ready'||fishWorth()<=0)return;
const win=arenaRoll(m.p),a=arenaAngle(win,m.p),before=state.money;m.state='spinning';m.rot=360*6+(360-a);m.start=Date.now();m.result={win,before,delta:Math.floor(before*.1)};
playSound('buy');updateArenaUI();const w=$('#arenaWheel');if(w){w.style.transition='none';w.style.transform='rotate(0deg)';void w.offsetWidth;w.style.transition=`transform ${ARENA_SPIN_MS}ms cubic-bezier(.12,.6,.1,1)`;w.style.transform=`rotate(${m.rot}deg)`;}
clearTimeout(arenaTimer);arenaTimer=setTimeout(finishArena,ARENA_SPIN_MS+150);}
function finishArena(){const m=arenaMatch;if(!m||m.state!=='spinning')return;m.state='done';const r=m.result;   // applied exactly once (state guard)
if(r.win)state.money+=r.delta;else state.money=Math.max(0,state.money-r.delta);r.after=state.money;
state.arena.history.unshift({name:m.name,worth:m.worth,opp:m.wealth,p:+m.p.toFixed(2),win:r.win,delta:r.win?r.delta:-r.delta,t:Date.now()});state.arena.history.length=Math.min(state.arena.history.length,10);
saveGame();lastSave=Date.now();updateHud();playSound(r.win?'rare':'low');toast(r.win?'ARENA VICTORY!':'ARENA DEFEAT',`${r.win?'+':'-'}${money(r.delta)} vs ${m.name}`);if(currentTab==='arena')renderArena();}
function updateArenaUI(){const m=arenaMatch,b=$('#arenaSpin'),n=$('#arenaNext'),s=$('#arenaStatus');if(!m)return;if(b)b.disabled=m.state!=='ready';if(n)n.disabled=m.state==='spinning';if(s)s.textContent=m.state==='spinning'?'Spinning…':m.state==='done'?'Match complete':'Ready to spin';}
function renderArena(){
if(fishWorth()<=0){arenaMatch=null;view.innerHTML=`<div class="tabPane panel arena"><h2 class="panelTitle">⚔ Arena</h2><div class="notice">You need at least one fish to enter the Arena. Adopt a fish from the Fish Shop first.</div></div>`;return;}
if(!arenaMatch||(arenaMatch.state==='ready'&&arenaMatch.worth!==fishWorth()))newArenaMatch();
const m=arenaMatch,w=m.p/100*360,pw=m.p.toFixed(2),pl=(100-m.p).toFixed(2),r=m.result,rel=Math.round(m.wealth/m.worth*100);
const hist=state.arena.history.map(x=>`<div class="row between arenaRow ${x.win?'w':'l'}"><span><b>${x.name}</b> <span class="tiny muted">${x.p.toFixed(2)}% odds · ${fmt(x.opp)} vs ${fmt(x.worth)}</span></span><b>${x.win?'WIN +':'LOSS −'}${fmt(Math.abs(x.delta))} ◈</b></div>`).join('')||'<p class="muted tiny">No matches yet.</p>';
const res=m.state==='done'&&r?`<div class="arenaResult ${r.win?'win':'lose'}"><div class="pixel">${r.win?'★ YOU WIN ★':'✗ YOU LOSE'}</div><b>${r.win?'+':'−'}${money(r.delta)}</b><div class="tiny">Balance: ${money(r.before)} → ${money(r.after)}</div>${r.win?Array.from({length:14},(_,i)=>`<i class="conf" style="left:${6+i*6.5}%;animation-delay:${(i%5)*.12}s;background:${['#ffd27a','#8ff4ee','#ff94a3','#d6a8ff'][i%4]}"></i>`).join(''):''}</div>`:'';
view.innerHTML=`<div class="tabPane panel arena"><div class="sectionHead"><div><h2 class="panelTitle">⚔ Arena</h2><div class="muted tiny">A simulated tournament: opponents are fictional, nothing is online. Win +10% of your shells, lose −10%.</div></div></div>
<div class="arenaGrid"><div class="card"><div class="pixel goldText">YOU</div><div class="row between"><span>Fish worth</span><b>${money(m.worth)}</b></div><div class="row between"><span>Shell balance</span><b id="arenaBal">${money(state.money)}</b></div><div class="row between"><span>Win chance</span><b class="goldText">${pw}%</b></div></div>
<div class="card"><div class="pixel" style="color:#ff94a3">OPPONENT</div><div class="row between"><span>Username</span><b>${m.name}</b></div><div class="row between"><span>Wealth</span><b>${money(m.wealth)}</b></div><div class="row between"><span>Compared to you</span><b>${rel}%</b></div></div></div>
<div class="arenaStage"><div class="arenaPointer"></div><div class="arenaWheel" id="arenaWheel" style="background:conic-gradient(#2cc3b5 0 ${w}deg,#d9566f ${w}deg 360deg);transform:rotate(${m.state==='ready'?0:m.rot}deg)"><span class="wl" style="transform:rotate(${w/2}deg) translateY(-92px)">WIN<br>${pw}%</span><span class="wl" style="transform:rotate(${w+(360-w)/2}deg) translateY(-92px)">LOSE<br>${pl}%</span></div><div class="arenaHub">VS</div></div>
<div class="center arenaBtns"><div id="arenaStatus" class="muted" style="margin-bottom:8px"></div><button class="gold" id="arenaSpin" data-arena="spin">SPIN</button> <button id="arenaNext" data-arena="next">Find another opponent</button></div>${res}
<h3 class="subhead" style="margin-top:18px">RECENT MATCHES</h3><div>${hist}</div></div>`;updateArenaUI();}
view.addEventListener('click',e=>{const b=e.target.closest('[data-arena]');if(!b||b.disabled)return;if(b.dataset.arena==='spin')spinArena();if(b.dataset.arena==='next'&&arenaMatch&&arenaMatch.state!=='spinning'){newArenaMatch();renderArena();}});

// NAVIGATION AND GAME LOOP -------------------------------------
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(!b)return;currentTab=b.dataset.tab;placingDecoration=null;render();});
function tick(){const now=Date.now(),dt=Math.max(0,(now-lastTick)/1000);lastTick=now;if(dt>0){const earn=currentIncome()*dt;addMoney(earn);state.playSeconds+=dt;state.tankClean=Math.max(0,state.tankClean-dt*(state.filterLevel?0.018:0.032));state.waterClean=Math.max(0,state.waterClean-dt*(state.filterLevel?0.012:0.024));state.food=Math.max(0,state.food-dt*.045);if(state.feedBuff>0)state.feedBuff=Math.max(0,state.feedBuff-dt);if(state.cleanBuff>0)state.cleanBuff=Math.max(0,state.cleanBuff-dt);if(state.waterBuff>0)state.waterBuff=Math.max(0,state.waterBuff-dt);if(state.expedition){state.expedition.remaining-=dt;if(state.expedition.remaining<=0)finishExpedition();}researchTick(dt);checkAchievements();}if(now-lastSave>12000){saveGame();lastSave=now;}updateHud();if(currentTab==='aquarium'){updateAquariumLive();updateExpLive();}if(currentTab==='shop')updateShopLive();if(currentTab==='aquarium'&&$('#expeditionTimer')&&state.expedition)$('#expeditionTimer').textContent=Math.ceil(state.expedition.remaining)+'s';if(currentTab==='discoveries'&&$('#expeditionTimer')&&state.expedition)$('#expeditionTimer').textContent=Math.ceil(state.expedition.remaining)+'s';}
let frame=0;function animate(now){if(currentTab==='aquarium'&&tankCtx){const dt=Math.min(.05,(now-frame)/1000||0);updateFish(dt,now/1000);renderTank(now/1000);}frame=now;requestAnimationFrame(animate);}
// Start aquarium and restore small randomized fish movement state.
{const seen=new Set();state.fish.forEach(f=>{if(!f.uid||seen.has(f.uid))f.uid=`f${Date.now().toString(36)}${Math.random().toString(36).slice(2,8)}`;seen.add(f.uid);const sp=getSpecies(f.species);if(!(Number(f.value)>0)&&sp)f.value=sp.price;});}
state.fish.forEach(f=>{if(!Number.isFinite(f.x))f.x=100+Math.random()*700;if(!Number.isFinite(f.y))f.y=100+Math.random()*280;if(!Number.isFinite(f.vx))f.vx=(Math.random()-.5)*35;if(!Number.isFinite(f.vy))f.vy=(Math.random()-.5)*15;});
render();setInterval(tick,250);requestAnimationFrame(animate);window.addEventListener('beforeunload',saveGame);
</script>
