function descriptions(id){return ({'clownfish':'A cheerful reef fish that shelters among anemones.','blue-green-chromis':'A peaceful, shimmering fish that loves swimming in loose schools.','yellowtail-damselfish':'A bold little reef fish with a bright yellow tail.','pajama-cardinalfish':'A quirky nocturnal fish with spots, stripes and big eyes.','midas-blenny':'A curious golden blenny that watches the reef from its perch.','banggai-cardinalfish':'An elegant cardinalfish with long fins and striking pale bands.','firefish-goby':'A darting fish with a fiery tail and a habit of hovering above the sand.','watchman-goby':'A watchful bottom-dweller that likes to sit near its burrow.','neon-goby':'A tiny cleaner fish marked with an electric blue stripe.','yellow-tang':'A bright yellow grazer that cruises around the reef.','coral-beauty':'A hardy dwarf angelfish with violet and orange markings.','sixline-wrasse':'A fast little wrasse decorated with six vivid stripes.','lyretail-anthias':'A graceful, social reef fish often seen in groups.','flame-anthias':'A warm orange-pink reef fish that swims in the open water.','royal-gramma':'A small basslet with a dramatic purple-to-yellow fade.','blue-tang':'A famous blue surgeonfish with a bold black pattern.','sailfin-tang':'A tall-finned tang that glides through open water.','foxface-rabbitfish':'A yellow reef fish with a dark face and defensive spines.','flame-angelfish':'A fiery dwarf angelfish with vertical dark accents.','copperband-butterflyfish':'A delicate butterflyfish with copper bands and a long snout.','longnose-butterflyfish':'A reef specialist with a long, narrow feeding snout.','melanurus-wrasse':'A colourful wrasse that patrols the reef looking for snacks.','cleaner-wrasse':'A slender fish known for its bright stripes and cleaning habits.','christmas-wrasse':'A colourful wrasse with festive green and red markings.','flame-hawkfish':'A perching hawkfish with a vivid red-orange body.','valentini-pufferfish':'A small puffer with bold markings and a playful shape.','yellow-boxfish':'A cube-shaped fish that paddles around with tiny fins.','zebra-moray-eel':'A striped moray that spends much of its time tucked into crevices.','tiger-tail-seahorse':'A delicate seahorse with a curled tail and banded body.','banded-pipefish':'A slender relative of the seahorse with a precise hovering swim.','clown-triggerfish':'A patterned triggerfish with a bold face and strong personality.','picasso-triggerfish':'An artistic reef fish decorated with sweeping lines.','mandarin-dragonet':'A jewel-like dragonet covered in intricate psychedelic markings.','regal-angelfish':'A spectacular angelfish with alternating blue and yellow bands.','purple-tang':'A vivid purple tang with a bright yellow tail.','bird-wrasse':'A long-snouted wrasse that moves quickly through the reef.','porcupine-pufferfish':'A large-eyed puffer with tiny spines and a gentle wobble.','longhorn-cowfish':'A boxy fish with little horns and a slow paddling motion.','dwarf-lionfish':'A small lionfish with elegant fan-like fins.','blue-spotted-jawfish':'A shy sand-dweller with bright blue spots.','emperor-angelfish':'A regal angelfish whose adult pattern is a maze of blue lines.','moorish-idol':'A striking disk-shaped fish with a tall trailing dorsal fin.','volitan-lionfish':'A dramatic lionfish with long venomous-looking fin rays.','ribbon-eel':'A remarkable eel that undulates through the water like a ribbon.','blue-spotted-stingray':'A graceful ray with electric-blue spots across its wings.','leafy-seadragon':'A master of disguise with leaf-like appendages and a drifting swim.','watanabei-angelfish':'A rare deep-water angelfish with pale blue and dark fin accents.','peacock-grouper':'A rare, patterned grouper with a powerful cruising glide.','scissortail-dartfish':'A delicate dartfish with a split tail and quick bursts of speed.','moorish-sunfish':'A broad-bodied open-water fish with a calm, steady cruise.','blue-ringed-octopusfish':'A filefish with bright ring-like markings and a curious hover.'})[id]}

let state=freshState();
function loadGame(){try{const raw=localStorage.getItem(SAVE_KEY);if(raw){const p=JSON.parse(raw);state={...freshState(),...p,settings:{...freshState().settings,...(p.settings||{}),odds:{...defaultOdds,...(p.settings?.odds||{})}}};state.fish=Array.isArray(state.fish)?state.fish:[];state.placed=Array.isArray(state.placed)?state.placed:[];}}catch(e){console.warn('Save could not be loaded',e);state=freshState();}}

loadGame();

const fmt=n=>Math.floor(n).toLocaleString('en-GB');

const conditionMult=()=>0.55+(state.cleanliness/100)*.25+(state.food/100)*.2+(state.feedBuff>0?.12:0)+(state.cleanBuff>0?.05:0);
function rawIncome(){return state.fish.reduce((sum,f)=>{const s=getSpecies(f.species);return sum+(s?s.income*RARITIES[s.rarity].mult*VARIANTS[f.variant||'Normal'].mult:0)},0)}
function currentIncome(){return rawIncome()*conditionMult()}
function addMoney(n){state.money+=n;state.lifetime+=n;}
function toast(title,sub=''){const el=$('#toast');el.innerHTML=`${title}<small>${sub}</small>`;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3000)}
function playSound(type='coin'){if(!state.settings.sound)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=playSound.ctx||(playSound.ctx=new C());const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);const freq=type==='rare'?880:type==='buy'?520:660;o.frequency.setValueAtTime(freq,c.currentTime);o.frequency.exponentialRampToValueAtTime(type==='rare'?1320:freq*1.25,c.currentTime+.12);g.gain.setValueAtTime(.045,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.18);o.start();o.stop(c.currentTime+.19);}catch(e){}}
function variantRoll(){const odds=state.settings.odds||defaultOdds;const roll=Math.random();let edge=0;for(const v of ['Shadow','Iridescent','Albino','Golden','Shiny']){const den=Math.max(1,Number(odds[v])||defaultOdds[v]);edge+=1/den;if(roll<edge)return v;}return 'Normal';}
function addFish(speciesId,variant=null,source='purchase'){const s=getSpecies(speciesId);if(!s)return null;const v=variant||variantRoll();const fish={uid:`f${Date.now().toString(36)}${Math.random().toString(36).slice(2,6)}`,species:speciesId,variant:v,x:120+Math.random()*710,y:120+Math.random()*260,vx:(Math.random()-.5)*35,vy:(Math.random()-.5)*18,phase:Math.random()*8,age:0,school:Math.random(),idleFor:0,nibbleTimer:0};state.fish.push(fish);state.totalFish++;state.totalDiscoveries++;const first=!state.discovered[speciesId];state.discovered[speciesId]=true;state.variantsFound[speciesId]=state.variantsFound[speciesId]||{Normal:false,Shiny:false,Golden:false,Albino:false,Iridescent:false,Shadow:false};state.variantsFound[speciesId][v]=true;checkAchievements();saveGame();if(first)toast('NEW SPECIES!',s.name+' added to your collection');if(v!=='Normal'){toast(`${v.toUpperCase()} DISCOVERY!`,`${s.name} · ${v} variant`);playSound('rare');}else if(first){playSound('rare');}else playSound('buy');return {fish,s,variant:v,first};}
function canBuy(s){return !s.exclusive && discoveredCount()>=unlockAt(s.rarity) && hasFishSpace() && state.money>=s.price;}
function unlockAt(r){return ({Common:0,Uncommon:2,Rare:5,Epic:10,Legendary:15,Mythical:23})[r]||0;}
function discoveredCount(){return Object.keys(state.discovered||{}).filter(k=>state.discovered[k]).length;}
function purchaseFish(id){const s=getSpecies(id);if(!s||!canBuy(s))return;state.money-=s.price;const result=addFish(id);if(result&&(result.first||result.variant!=='Normal'))showReveal(result,'Fish Shop Adoption');render();}
function rollDiscovery(pkg){const configs={Basic:{cost:140,weights:{Common:66,Uncommon:25,Rare:8,Epic:1,Legendary:0,Mythical:0}},Premium:{cost:420,weights:{Common:20,Uncommon:37,Rare:28,Epic:12,Legendary:3,Mythical:0}},'Deep Sea':{cost:1100,weights:{Common:3,Uncommon:14,Rare:32,Epic:31,Legendary:17,Mythical:3}}};const cfg=configs[pkg];if(state.money<cfg.cost||!hasFishSpace())return;state.money-=cfg.cost;let rarity=weighted(cfg.weights);let pool=species.filter(s=>s.rarity===rarity&&!s.exclusive);if(!pool.length){pool=species.filter(s=>!s.exclusive&&RARITIES[s.rarity].mult<=RARITIES[rarity].mult);}if(!pool.length)pool=species.filter(s=>!s.exclusive);const chosen=pool[Math.floor(Math.random()*pool.length)];const result=addFish(chosen.id);state.packageHistory++;showReveal(result,`${pkg} Discovery`);render();}
function weighted(o){let n=Math.random()*Object.values(o).reduce((a,b)=>a+b,0);for(const [k,v] of Object.entries(o)){n-=v;if(n<0)return k;}return Object.keys(o)[0];}
function startExpedition(kind){if(state.expedition||fishCount()>=levelCapacity())return;const c={Coastal:{cost:180,duration:45},Reef:{cost:450,duration:90},Abyssal:{cost:1000,duration:180}}[kind];if(!c||state.money<c.cost)return;state.money-=c.cost;state.expedition={kind,remaining:c.duration,started:Date.now(),duration:c.duration};toast('EXPEDITION LAUNCHED',`${kind} voyage is underway`);playSound('buy');saveGame();render();}
function finishExpedition(){if(!state.expedition)return;const kind=state.expedition.kind;state.expedition=null;state.completedExpeditions=(state.completedExpeditions||0)+1;let found;let roll=Math.random();if(kind==='Abyssal'&&roll<.22){found=addFish('watanabei-angelfish');}else if(roll<.42){const id=kind==='Coastal'?'blue-spotted-stingray':'leafy-seadragon';found=addFish(id);}else if(roll<.72){const pool=species.filter(s=>s.exclusive);found=addFish(pool[Math.floor(Math.random()*pool.length)].id);}else{const reward=kind==='Coastal'?180:kind==='Reef'?430:900;addMoney(reward);toast('EXPEDITION RETURNED',`Your crew brought back ${money(reward)}.`);playSound('coin');saveGame();render();return;}showReveal(found,`${kind} Expedition`);render();}
function showReveal(result,source){if(!result)return;const {fish,s,variant,first}=result;activeModal='reveal';const root=$('#modalRoot');root.innerHTML=`<div class="modalBack"><div class="modal"><div class="pixel goldText">✦ ${source.toUpperCase()} ✦</div><h2>${first?'A NEW SPECIES!':'YOU FOUND A FISH!'}</h2><canvas class="revealFish" id="revealCanvas" width="180" height="110"></canvas><div class="bigName" style="color:${RARITIES[s.rarity].color}">${s.name.toUpperCase()}</div><div><span class="badge ${s.rarity.toLowerCase()}">${s.rarity}</span> <span class="badge">${variant}</span></div><p>${s.desc}</p><button class="primary" id="closeReveal">ADD TO AQUARIUM</button></div></div>`;const c=$('#revealCanvas').getContext('2d');c.imageSmoothingEnabled=false;drawSprite(c,s,variant,68,40,1.5,false,performance.now()/1000);$('#closeReveal').onclick=()=>{root.innerHTML='';activeModal=null;};}

const spriteCache=new Map();
function shiftColor(hex,kind){if(kind==='Normal')return hex;const rgb=hex.match(/[\da-f]{2}/gi).map(x=>parseInt(x,16));if(kind==='Golden')return '#'+[Math.min(255,rgb[0]*.65+95),Math.min(255,rgb[1]*.68+80),Math.min(255,rgb[2]*.35+15)].map(x=>Math.round(x).toString(16).padStart(2,'0')).join('');if(kind==='Albino')return '#'+[Math.min(255,rgb[0]*.35+170),Math.min(255,rgb[1]*.35+170),Math.min(255,rgb[2]*.35+175)].map(x=>Math.round(x).toString(16).padStart(2,'0')).join('');if(kind==='Shadow')return '#'+rgb.map(x=>Math.round(x*.28+12).toString(16).padStart(2,'0')).join('');if(kind==='Iridescent')return ['#58e3db','#c77bff','#f28bc3'][Math.floor((rgb[0]+rgb[1]+rgb[2])/150)%3];if(kind==='Shiny')return '#'+[rgb[2],Math.min(255,rgb[0]+35),Math.min(255,rgb[1]+30)].map(x=>Math.round(x).toString(16).padStart(2,'0')).join('');return hex;}
function makeSprite(s,variant='Normal'){const key=s.id+'_'+variant;if(spriteCache.has(key))return spriteCache.get(key);const c=document.createElement('canvas');c.width=48;c.height=32;const x=c.getContext('2d');x.imageSmoothingEnabled=false;const a=shiftColor(s.c1,variant),b=shiftColor(s.c2,variant),dark=variant==='Shadow'?'#0b1028':'#183b4b',eye=variant==='Albino'?'#ed6c83':variant==='Shadow'?'#8ffaff':'#142d3c';const px=(xx,yy,w,h,col)=>{x.fillStyle=col;x.fillRect(xx,yy,w,h)};
 // fins and tail
 if(s.shape==='seahorse'){px(16,5,9,5,b);px(20,4,3,4,a);px(24,11,4,11,b);px(20,20,7,4,a);px(19,24,6,3,b);px(18,25,3,4,a);px(13,8,5,14,b);px(12,10,4,8,a);px(11,7,6,4,a);px(11,5,5,4,b);px(8,7,5,4,a);px(8,10,4,3,b);px(5,11,5,2,a);px(26,9,5,5,b);}
 else if(s.shape==='eel'){px(3,13,31,7,a);px(1,14,6,4,b);px(30,12,5,6,a);px(33,11,6,8,b);px(37,12,5,5,a);}
 else if(s.shape==='ray'){px(6,8,9,6,b);px(12,5,18,7,a);px(16,8,13,12,a);px(27,9,12,5,b);px(21,18,3,11,a);}
 else if(s.shape==='spiky'){px(9,9,19,14,a);px(5,11,7,10,b);px(27,8,8,17,b);px(13,4,3,7,a);px(20,3,3,8,b);px(26,5,3,7,a);px(13,21,3,7,b);px(21,21,3,7,a);}
 else { // general fish
  px(5,12,7,8,b);px(2,14,7,4,a);px(6,9,7,5,a);px(6,20,7,4,b);
  if(s.shape==='tall'){px(14,4,12,4,b);px(17,6,13,18,a);px(13,10,5,12,b);px(24,8,7,14,a);px(18,23,9,4,b);}
  else if(s.shape==='round'||s.shape==='box'){px(10,8,18,16,a);px(13,5,12,4,b);px(13,23,12,3,b);if(s.shape==='box'){px(9,8,21,17,dark);px(11,9,17,14,a);}}
  else {px(10,10,20,12,a);px(13,7,13,4,b);px(13,21,13,4,b);px(26,11,6,10,a);}
  px(28,12,5,8,b);
 }
 // subtle pattern bands / spots
 if(['blue-tang','regal-angelfish','emperor-angelfish','banggai-cardinalfish','copperband-butterflyfish','zebra-moray-eel'].includes(s.id)){for(let i=0;i<3;i++)px(13+i*5,9,2,14,b);}
 else if(['mandarin-dragonet','clown-triggerfish','picasso-triggerfish','porcupine-pufferfish'].includes(s.id)){for(let i=0;i<5;i++)px(13+(i%3)*5,9+Math.floor(i/3)*7,2,2,b);}
 else {px(17,10,3,2,b);px(22,17,3,2,b);}
 // eye, mouth, variant sparkle spot
 px(11,12,3,3,'#effff2');px(12,13,2,2,eye);px(4,18,3,1,dark);
 if(variant==='Golden'){px(19,10,4,2,'#fff2a3');px(17,19,5,2,'#fff0a6');}
 if(variant==='Iridescent'){px(15,8,5,2,'#f6d7ff');px(23,20,5,2,'#a0fffb');}
 if(variant==='Shadow'){px(11,12,4,4,'#63f8ff');}
 // scales and fins highlights
 px(17,9,5,1,'rgba(255,255,255,.6)');px(15,22,5,1,'rgba(255,255,255,.4)');
 spriteCache.set(key,c);return c;}
function drawSprite(ctx,s,variant,x,y,scale=1,flip=false,t=0){const spr=makeSprite(s,variant);ctx.save();ctx.translate(x,y+Math.sin(t*2.2)*1.5);if(flip)ctx.scale(-1,1);ctx.imageSmoothingEnabled=false;ctx.drawImage(spr,-24*scale,-16*scale,48*scale,32*scale);if(variant!=='Normal'&&state.settings.animations){const sparkle=((Math.floor(t*6)+s.name.length)%4);ctx.fillStyle=variant==='Golden'?'#fff1a0':variant==='Shadow'?'#84ffff':'#f7f6ff';ctx.fillRect((sparkle*7-11)*scale,-13*scale,2*scale,2*scale);}ctx.restore();}

let tankCanvas=null,tankCtx=null;
function setupTank(){tankCanvas=$('#tank');if(!tankCanvas)return;tankCtx=tankCanvas.getContext('2d');tankCtx.imageSmoothingEnabled=false;const wrap=$('#tankWrap');if(wrap){wrap.style.borderWidth=(4+Math.floor((state.tankLevel-1)/3))+'px';wrap.style.borderColor=state.tankLevel>=7?'#e6cc87':state.tankLevel>=4?'#81e9d7':'#5ac9cd';}tankCanvas.onclick=onTankClick;}
function onTankClick(e){if(!tankCanvas)return;const r=tankCanvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*960,y=(e.clientY-r.top)/r.height*480;if(placingDecoration){state.placed.push({id:placingDecoration,x:x/960,y:y/480});placingDecoration=null;toast('DECORATION PLACED','Your reef is looking lovely.');saveGame();render();return;}let hit=null,dist=Infinity;for(const f of fishScreen){const d=Math.hypot(f.x-x,f.y-y);if(d<Math.max(28,f.size*1.5)&&d<dist){hit=f.f;dist=d;}}if(hit){hit.phase+=2;hit.vy-=20;toast('HELLO, LITTLE FISH!','You gave your '+getSpecies(hit.species).name+' a wave.');}else{toast('A LITTLE SPLASH','Your fish are curious.');}}
function drawPlant(ctx,x,y,h,col,phase=0){ctx.fillStyle='#145e58';ctx.fillRect(x-2,y-h*.15,4,h*.15);for(let i=0;i<5;i++){const yy=y-h*(i+1)/6;const sway=Math.sin(phase+i*.65)*5;ctx.fillStyle=col;ctx.fillRect(x+sway,yy,4,Math.max(5,h/7));ctx.fillRect(x+sway-3,yy+4,4,Math.max(4,h/8));}}
function drawCoral(ctx,x,y,scale,col,phase){ctx.fillStyle=col;const p=(xx,yy,w,h)=>ctx.fillRect(x+xx*scale,y+yy*scale,w*scale,h*scale);p(-3,0,7,12);p(-8,-5+Math.sin(phase)*1,5,8);p(1,-8+Math.cos(phase)*1,5,11);p(6,-3,5,8);p(-1,-14,4,8);}
function drawScene(ctx,t){const bg=['#0a5b78','#07516c','#183e69','#164f57'][state.background%4];const grad=ctx.createLinearGradient(0,0,0,480);grad.addColorStop(0,'#43bfd0');grad.addColorStop(.15,bg);grad.addColorStop(1,'#052c49');ctx.fillStyle=grad;ctx.fillRect(0,0,960,480);
 // light shafts
 if(state.settings.animations){for(let i=0;i<6;i++){ctx.fillStyle=`rgba(177,255,239,${.025+Math.sin(t*.4+i)*.012})`;ctx.beginPath();ctx.moveTo(i*190+30,0);ctx.lineTo(i*190+110,0);ctx.lineTo(i*190+230,390);ctx.lineTo(i*190+150,390);ctx.fill();}}
 // distant reef silhouettes
 ctx.fillStyle='rgba(2,44,62,.45)';for(let i=0;i<10;i++){const x=i*110-20;ctx.fillRect(x,340-(i%3)*18,70,140);ctx.fillRect(x+10,320-(i%3)*18,17,38);}
 // substrate
 ctx.fillStyle='#b99a68';ctx.fillRect(0,428,960,52);ctx.fillStyle='#d7bd86';for(let i=0;i<95;i++){const x=(i*83)%960,y=430+(i*19)%44;ctx.fillRect(x,y,3+(i%3),2);}ctx.fillStyle='#806e54';for(let i=0;i<35;i++)ctx.fillRect((i*137)%960,465+(i%3)*3,8,3);
 // gravel foreground + planted areas
 for(let i=0;i<10;i++){drawPlant(ctx,35+i*16,430,45+(i%3)*12,'#23886e',t+i);drawPlant(ctx,850+i*13,430,56+(i%4)*9,'#2d9670',t+i*.8);}
 drawCoral(ctx,150,432,2.4,'#e37b74',t);drawCoral(ctx,190,435,1.6,'#c86a8e',t+1);drawCoral(ctx,760,434,2.2,'#d68c59',t+2);drawCoral(ctx,812,431,1.7,'#b478cf',t+3);
 // decor objects behind fish
 // decorations are drawn in the foreground pass so fish can briefly swim behind them.
 // bubbles
 if(state.settings.animations){for(let i=0;i<22;i++){const x=(i*107+Math.sin(t*.35+i)*10)%960;const y=470-((t*(15+i%4)+i*61)%510);ctx.strokeStyle='rgba(179,255,250,.48)';ctx.lineWidth=2;ctx.strokeRect(Math.round(x),Math.round(y),3,3);}}
 // glass shimmer
 ctx.fillStyle='rgba(190,255,244,.16)';ctx.fillRect(0,0,960,4);ctx.fillRect(0,0,4,480);ctx.fillStyle='rgba(190,255,244,.08)';ctx.fillRect(8,8,944,2);
 if(state.filterLevel>0){ctx.fillStyle='#16485a';ctx.fillRect(844,4,76,28);ctx.fillStyle='#4b8990';ctx.fillRect(850,7,64,7);ctx.fillStyle='#9adad0';ctx.fillRect(854,9,10,3);ctx.fillStyle='#0a283a';ctx.fillRect(850,17,64,12);for(let i=0;i<Math.min(5,state.filterLevel+1);i++){const bx=850+i*13,by=39+((t*25+i*17)%85);ctx.strokeStyle='rgba(180,255,246,.55)';ctx.strokeRect(bx,by,3,3);}}
}
function drawDecoration(ctx,id,x,y,t){if(id==='pink-coral'||id==='fan-coral'){drawCoral(ctx,x,y,id==='fan-coral'?2.6:1.9,id==='fan-coral'?'#d88cc5':'#ed8aa6',t+x);}else if(id==='blue-rock'){ctx.fillStyle='#667e89';ctx.fillRect(x-18,y-10,37,22);ctx.fillRect(x-12,y-17,23,8);ctx.fillStyle='#93adb0';ctx.fillRect(x-12,y-12,6,3);}else if(id==='anemone'){for(let i=0;i<8;i++){ctx.fillStyle=['#f7b5b0','#e88cb3','#f9d4a2'][i%3];ctx.fillRect(x-12+i*3,y-22+Math.sin(t*2+i)*3,2,24);}ctx.fillStyle='#e9c9a1';ctx.fillRect(x-13,y,27,5);}else if(id==='treasure'){ctx.fillStyle='#a46b35';ctx.fillRect(x-17,y-12,34,18);ctx.fillStyle='#e9c65e';ctx.fillRect(x-14,y-15,28,6);ctx.fillRect(x-2,y-7,4,5);}else if(id==='seaweed'){drawPlant(ctx,x,y,70,'#48aa77',t+x);}}
let fishScreen=[];
function updateFish(dt,t){for(let i=0;i<state.fish.length;i++){const f=state.fish[i],s=getSpecies(f.species);if(!s)continue;f.age=(f.age||0)+dt;f.idleFor=Math.max(0,(f.idleFor||0)-dt);f.nibbleTimer=Math.max(0,(f.nibbleTimer||0)-dt);const speed={dart:48,school:25,hover:13,bottom:17,cruise:29,seahorse:12,eel:20}[s.behavior]||25;
 if(f.idleFor<=0&&Math.random()<dt*.24){f.vx=(Math.random()-.5)*speed*1.2;f.vy=(Math.random()-.5)*speed*.5;if(s.behavior==='bottom'||s.behavior==='eel')f.vy=(Math.random()-.5)*6;if(s.behavior==='seahorse')f.vy=(Math.random()-.5)*22;}
 if(f.idleFor<=0&&Math.random()<dt*.035)f.idleFor=.35+Math.random()*.8;
 if(f.idleFor>0){f.vx*=Math.pow(.04,dt);f.vy*=Math.pow(.04,dt);}
 if(s.behavior==='school'){const others=state.fish.filter(o=>o!==f&&o.species===f.species);if(others.length){const near=others.reduce((best,o)=>Math.hypot(o.x-f.x,o.y-f.y)<Math.hypot(best.x-f.x,best.y-f.y)?o:best,others[0]);f.vx+=(near.x-f.x)*dt*.08;f.vy+=(near.y-f.y)*dt*.05;}}
 const targetX=f.x+f.vx*dt;let targetY=f.y+f.vy*dt;if(s.behavior==='bottom'||s.behavior==='eel')targetY=Math.max(340,Math.min(418,targetY));else if(s.behavior==='seahorse')targetY=Math.max(100,Math.min(360,targetY));else targetY=Math.max(90,Math.min(390,targetY));
 if(targetX<45||targetX>915)f.vx*=-1;if(targetY<65||targetY>420)f.vy*=-1;f.x=Math.max(35,Math.min(925,targetX));f.y=Math.max(65,Math.min(420,targetY));f.vx=Math.max(-speed,Math.min(speed,f.vx));f.vy=Math.max(-speed*.5,Math.min(speed*.5,f.vy));
 const nearDecor=state.placed.some(d=>Math.hypot(f.x-d.x*960,f.y-d.y*480)<62);if((f.y>365||nearDecor)&&Math.random()<dt*.09)f.nibbleTimer=.7;
 }}
function renderTank(t){if(!tankCtx||!tankCanvas)return;const c=tankCtx;c.clearRect(0,0,960,480);drawScene(c,t);fishScreen=[];if(state.fish.length){const ordered=[...state.fish].sort((a,b)=>a.y-b.y);for(const f of ordered){const s=getSpecies(f.species);if(!s)continue;const scale=s.shape==='ray'?1.15:s.shape==='seahorse'?.88:s.shape==='eel'?.9:.9+(s.name.length%4)*.06;const wob=Math.sin(t*4+f.phase)*2+(f.idleFor>0?Math.sin(t*1.5+f.phase)*1.5:0);drawSprite(c,s,f.variant,f.x,f.y+wob,scale,f.vx<0,t+f.phase);if(f.nibbleTimer>0){c.fillStyle='rgba(218,255,242,.8)';c.fillRect(f.x+14,f.y-17,3,3);c.fillRect(f.x+19,f.y-23,2,2);}fishScreen.push({f,x:f.x,y:f.y,size:25*scale});}}else{c.fillStyle='rgba(220,255,245,.8)';c.font='18px VT323';c.fillText('Your reef is waiting for its first fish...',310,235);}
 // foreground fronds and bought objects occasionally overlap fish, giving them somewhere to hide.
 for(const d of state.placed){drawDecoration(c,d.id,d.x*960,d.y*480,t);}
 drawPlant(c,48,430,48,'#2f926e',t+1);drawPlant(c,905,430,56,'#27896f',t+2);
}

function render(){updateHud();const tab=currentTab;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='aquarium')renderAquarium();if(tab==='shop')renderShop();if(tab==='discoveries')renderDiscoveries();if(tab==='collection')renderCollection();if(tab==='upgrades')renderUpgrades();if(tab==='statistics')renderStatistics();if(tab==='settings')renderSettings();}
function updateHud(){$('#money').textContent=fmt(state.money);$('#income').textContent=currentIncome().toFixed(1);$('#capacity').textContent=`${fishCount()} / ${levelCapacity()}`;}
function renderAquarium(){view.innerHTML=`<div class="tabPane layout2"><section><div class="panel"><div class="sectionHead"><div><h2 class="panelTitle">01 / Your Aquarium</h2><div class="muted">A little slice of the tropics. Click a fish to say hello.</div></div><span class="badge">TANK LV. ${state.tankLevel}</span></div><div id="tankWrap"><canvas id="tank" width="960" height="480" aria-label="Animated tropical aquarium"></canvas><div id="tankHint">${placingDecoration?'CLICK TANK TO PLACE DECORATION':'CLICK A FISH TO INTERACT'}</div></div><div class="tankToolbar"><button class="primary" id="feedBtn">♥ Feed fish</button><button id="cleanBtn">✧ Clean glass</button><button id="waterBtn">♨ Refresh water</button><span class="muted tiny">Maintenance boosts income temporarily.</span></div><div class="tankStats"><div class="tankStat"><strong>${fishCount()} / ${levelCapacity()}</strong><span>Fish capacity</span></div><div class="tankStat"><strong>${currentIncome().toFixed(2)}</strong><span>Shells / sec</span></div><div class="tankStat"><strong>${discoveredCount()} / 50</strong><span>Species found</span></div><div class="tankStat"><strong>${Object.values(state.variantsFound).reduce((n,o)=>n+Object.values(o).filter(Boolean).filter((v,i)=>true).length,0)}</strong><span>Variant records</span></div></div></div><div class="panel"><h2 class="panelTitle">Your little reef</h2><div class="row between"><span>Cleanliness</span><strong>${Math.round(state.cleanliness)}%</strong></div><div class="progress"><i style="width:${state.cleanliness}%"></i></div><div class="row between" style="margin-top:10px"><span>Feeding</span><strong>${Math.round(state.food)}%</strong></div><div class="progress"><i style="width:${state.food}%"></i></div><div class="row between" style="margin-top:10px"><span>Fish happiness</span><strong>${Math.round(state.cleanliness*.45+state.food*.55)}%</strong></div><div class="progress"><i style="width:${state.cleanliness*.45+state.food*.55}%"></i></div><p class="muted tiny">A tidy, well-fed aquarium earns more. Maintenance meters slowly drift down while you play; nothing bad happens to your fish.</p></div></section><aside><div class="panel"><h2 class="panelTitle">Reef keeper's notebook</h2><div class="notice">Your fish earn <b>${currentIncome().toFixed(2)} shells</b> every second while the game is open. Closing the game pauses income.</div><div style="margin-top:14px"><div class="subhead">QUICK ACTIONS</div><div class="row"><button data-goto="shop">Find new fish →</button><button data-goto="discoveries">Mystery discovery ✦</button></div></div><div style="margin-top:18px"><div class="subhead">LATEST COLLECTION</div>${latestFishHtml()}</div><div style="margin-top:18px"><div class="subhead">NEXT MILESTONE</div>${nextMilestoneHtml()}</div></div><div class="panel"><h2 class="panelTitle">Expedition status</h2>${state.expedition?`<div class="pixel goldText">${state.expedition.kind.toUpperCase()} EXPEDITION</div><p>Returning in <b id="expeditionTimer">${Math.ceil(state.expedition.remaining)}s</b></p><div class="progress"><i style="width:${100*(1-state.expedition.remaining/state.expedition.duration)}%"></i></div>`:'<p class="muted">No expedition underway. Send your little research vessel out from Discoveries.</p>'}</div></aside></div>`;setupTank();$('#feedBtn').onclick=()=>{state.food=100;state.feedBuff=300;toast('TIME TO EAT!','Your fish are feeling extra cheerful. +12% income for 5 minutes.');playSound('coin');saveGame();render();};$('#cleanBtn').onclick=()=>{state.cleanliness=100;state.cleanBuff=240;toast('SPARKLING GLASS','Your aquarium is crystal clear. +5% income for 4 minutes.');playSound('coin');saveGame();render();};$('#waterBtn').onclick=()=>{state.cleanliness=100;state.food=Math.min(100,state.food+35);state.cleanBuff=180;toast('FRESH WATER','A little refresh for your reef.');saveGame();render();};view.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{currentTab=b.dataset.goto;render();});}
function latestFishHtml(){const recent=state.fish.slice(-3).reverse();if(!recent.length)return '<p class="muted">No fish yet. Your first friend is waiting in the shop!</p>';return recent.map(f=>{const s=getSpecies(f.species);return `<div class="row" style="margin:6px 0"><canvas class="fishIcon" data-preview="${s.id}" data-variant="${f.variant}" width="56" height="38"></canvas><div><b>${s.name}</b><div class="tiny muted">${f.variant==='Normal'?'Normal':`✦ ${f.variant}`}</div></div></div>`}).join('');}
function nextMilestoneHtml(){const n=discoveredCount();const next=[5,10,20,30,40,50].find(x=>x>n)||50;return `<p><b>${n} / ${next}</b> species discovered</p><div class="progress"><i style="width:${Math.min(100,n/next*100)}%"></i></div><p class="tiny muted">Milestone reward: ${next===50?'The complete reef!':money(next*60)}</p>`;}
function previewCanvases(){view.querySelectorAll('canvas[data-preview]').forEach(c=>{const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;const s=getSpecies(c.dataset.preview);drawSprite(ctx,s,c.dataset.variant,28,20,.7,false,1);});}
function renderShop(){const unlocked=species.filter(s=>!s.exclusive&&discoveredCount()>=unlockAt(s.rarity));const locked=species.filter(s=>!s.exclusive&&discoveredCount()<unlockAt(s.rarity));view.innerHTML=`<div class="panel tabPane"><div class="sectionHead"><div><h2 class="panelTitle">02 / Fish Shop</h2><div class="muted">Adopt a new friend for your reef. Every purchase rolls for a special variant.</div></div><span class="badge">${fishCount()} / ${levelCapacity()} TANK SPACE</span></div><div class="row between" style="margin-bottom:12px"><span class="muted">Unlocked species: ${unlocked.length} · Discover more to unlock rarer stock.</span><span class="goldText">${money(state.money)}</span></div><div class="filters"><select id="shopRarity"><option>All</option>${Object.keys(RARITIES).map(r=>`<option>${r}</option>`).join('')}</select><input id="shopSearch" placeholder="Search fish..."><select id="shopSort"><option value="progress">Recommended</option><option value="price">Price: low to high</option><option value="income">Income: high to low</option></select></div><div id="shopList" class="listScroll"></div><div style="margin-top:15px"><div class="notice">Tank full? Visit <b>Upgrades</b> to make room for more fish. Species unlock as your collection grows.</div></div></div>`;function fill(){const rar=$('#shopRarity').value,q=$('#shopSearch').value.toLowerCase(),sort=$('#shopSort').value;let list=unlocked.filter(s=>(rar==='All'||s.rarity===rar)&&s.name.toLowerCase().includes(q));if(sort==='price')list.sort((a,b)=>a.price-b.price);if(sort==='income')list.sort((a,b)=>b.income-a.income);if(sort==='progress')list.sort((a,b)=>Object.keys(RARITIES).indexOf(a.rarity)-Object.keys(RARITIES).indexOf(b.rarity)||a.price-b.price);$('#shopList').innerHTML=list.map(s=>{const ok=canBuy(s);return `<div class="fishRow"><canvas class="fishIcon" data-preview="${s.id}" data-variant="Normal" width="56" height="38"></canvas><div><h3>${s.name}</h3><p><span class="badge ${s.rarity.toLowerCase()}">${s.rarity}</span> · ${s.desc}</p><p>${money(s.price)} · <span class="goldText">${(s.income*RARITIES[s.rarity].mult).toFixed(2)}/s</span></p></div><div class="buyBlock"><button class="primary small" data-buy="${s.id}" ${ok?'':'disabled'}>Adopt</button></div></div>`}).join('')||'<div class="empty">No fish match that search.</div>';$('#shopList').querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>purchaseFish(b.dataset.buy));previewCanvases();}['shopRarity','shopSearch','shopSort'].forEach(id=>$('#'+id).addEventListener('input',fill));fill();}
function renderDiscoveries(){const packages=[['Basic',140,'A gentle introduction to the reef. Mostly common fish, with a small chance of something special.'],['Premium',420,'A better chance at Rare and Epic species, with a sliver of Legendary luck.'],['Deep Sea',1100,'A deep-water dive with real chances at Epic and Legendary finds.']];view.innerHTML=`<div class="tabPane"><div class="panel"><div class="sectionHead"><div><h2 class="panelTitle">03 / Mystery Discoveries</h2><div class="muted">Open a discovery package. Each fish gets its own independent variant roll.</div></div><span class="goldText">${money(state.money)}</span></div><div class="grid">${packages.map(([name,cost,desc],i)=>`<div class="card"><div class="pixel ${i===2?'legendary':i===1?'epic':'uncommon'}">${['STARTER DIVE','REEF EXPLORER','ABYSSAL VAULT'][i]}</div><h3 style="margin-top:10px">${name} Package</h3><p>${desc}</p><div class="row between" style="margin-top:12px"><b class="goldText">${money(cost)}</b><button class="primary small" data-pack="${name}" ${state.money>=cost&&hasFishSpace()?'':'disabled'}>Open</button></div></div>`).join('')}</div><p class="muted tiny" style="margin-top:12px">Packages can contain duplicates. Duplicates still earn income and may have a different variant.</p></div><div class="panel"><div class="sectionHead"><div><h2 class="panelTitle">Expedition Vessel</h2><div class="muted">Send a tiny crew to unexplored waters. Expeditions count down only while this game is running.</div></div><span class="badge">${state.expedition?'VESSEL AT SEA':'READY TO SAIL'}</span></div>${state.expedition?`<div class="notice"><b>${state.expedition.kind} expedition in progress.</b> Time remaining: <span id="expeditionTimer">${Math.ceil(state.expedition.remaining)}s</span><div class="progress" style="margin-top:8px"><i style="width:${100*(1-state.expedition.remaining/state.expedition.duration)}%"></i></div></div>`:`<div class="grid">${[['Coastal',180,45,'Common and uncommon reef discoveries.'],['Reef',450,90,'A longer trip with better rewards and rare finds.'],['Abyssal',1000,180,'Deep-water discoveries, including exclusive species.']].map(([n,c,d,desc])=>`<div class="card"><div class="pixel">${n.toUpperCase()} VOYAGE</div><h3>${n}</h3><p>${desc}</p><p class="goldText">${money(c)} · ${d}s</p><button class="small" data-expedition="${n}" ${state.money>=c&&hasFishSpace()?'':'disabled'}>Set sail</button></div>`).join('')}</div>`}<div class="notice" style="margin-top:14px">Exclusive expedition fish: <b>Blue-Spotted Stingray</b>, <b>Leafy Seadragon</b> and <b>Watanabei Angelfish</b>.</div></div></div>`;view.querySelectorAll('[data-pack]').forEach(b=>b.onclick=()=>rollDiscovery(b.dataset.pack));view.querySelectorAll('[data-expedition]').forEach(b=>b.onclick=()=>startExpedition(b.dataset.expedition));}
function renderCollection(){const found=discoveredCount(),variantsCount=Object.values(state.variantsFound).reduce((n,o)=>n+Object.values(o).filter(Boolean).length,0);view.innerHTML=`<div class="panel tabPane"><div class="sectionHead"><div><h2 class="panelTitle">04 / Field Guide</h2><div class="muted">Your very own encyclopedia of the reef. Find all 50 species and collect their variants.</div></div><div class="pixel goldText">${found}/50 FOUND</div></div><div class="row" style="gap:18px;margin-bottom:13px"><div class="grow"><div class="row between"><b>Species collection</b><span>${Math.round(found/50*100)}%</span></div><div class="progress"><i style="width:${found/50*100}%"></i></div></div><div><b>${variantsCount}/300</b><div class="tiny muted">Variant records</div></div><div><b>${fishCount()}</b><div class="tiny muted">Fish owned</div></div></div><div class="filters"><input id="collectionSearch" placeholder="Search species..."><select id="collectionRarity"><option>All rarities</option>${Object.keys(RARITIES).map(r=>`<option>${r}</option>`).join('')}</select><select id="collectionStatus"><option>All species</option><option>Discovered</option><option>Undiscovered</option></select><select id="collectionVariant"><option>All variants</option>${Object.keys(VARIANTS).map(v=>`<option>${v}</option>`).join('')}</select></div><div id="collectionList" class="grid"></div></div>`;function fill(){const q=$('#collectionSearch').value.toLowerCase(),rar=$('#collectionRarity').value,st=$('#collectionStatus').value,v=$('#collectionVariant').value;const list=species.filter(s=>(!q||s.name.toLowerCase().includes(q))&&(rar==='All rarities'||s.rarity===rar)&&(st==='All species'||(st==='Discovered'?!!state.discovered[s.id]:!state.discovered[s.id]))&&(v==='All variants'||!!state.variantsFound[s.id]?.[v]));$('#collectionList').innerHTML=list.map(s=>{const known=!!state.discovered[s.id],variants=state.variantsFound[s.id]||{};const counts=Object.keys(VARIANTS).filter(k=>variants[k]).length;const fishOwned=state.fish.filter(f=>f.species===s.id).length;const variantsHtml=known?Object.keys(VARIANTS).map(v=>`<span title="${v}" class="badge" style="margin:2px;${variants[v]?'color:#b4ffe6':'color:#668b91;opacity:.65'}">${variants[v]?'✓':'·'} ${v}</span>`).join(''):'<span class="muted tiny">Discover this species to reveal its variants.</span>';return `<div class="card ${known?'':'locked'}"><div class="row between"><span class="badge ${s.rarity.toLowerCase()}">${known?s.rarity:'???'}</span><span class="tiny muted">#${String(species.indexOf(s)+1).padStart(2,'0')}</span></div><div class="row" style="margin-top:9px;gap:10px"><canvas class="fishIcon" data-preview="${s.id}" data-variant="Normal" width="56" height="38"></canvas><div><h3>${known?s.name:'Unknown species'}</h3><p>${known?s.desc:'A mysterious silhouette waits to be discovered.'}</p></div></div><p class="tiny">${known?`${fishOwned} owned · ${counts}/6 variants found`:'Not yet discovered'}</p><div>${variantsHtml}</div></div>`}).join('')||'<div class="empty">No species found for those filters.</div>';previewCanvases();if(st==='Undiscovered')$('#collectionList').querySelectorAll('canvas').forEach(c=>{const x=c.getContext('2d');x.fillStyle='#061b2b';x.fillRect(0,0,56,38);x.fillStyle='#19394b';x.fillRect(10,16,34,7);x.fillRect(20,11,17,5);});}['collectionSearch','collectionRarity','collectionStatus','collectionVariant'].forEach(id=>$('#'+id).addEventListener('input',fill));fill();}
const upgradeData=[{name:'Roomier Reef',desc:'Expand your tank and welcome 5 more fish.',costs:[450,950,1800,3200,5600,9000,14000,21000,31000],type:'capacity'},{name:'New Waterworld',desc:'Change the aquarium backdrop to a new underwater scene.',costs:[650,1400,2800],type:'background'},{name:'Reef Filter',desc:'Improve your aquarium equipment. Each level softens maintenance decay.',costs:[500,1100,2200,4000],type:'filter'}];

function renderUpgrades(){const decor=[['pink-coral','Pink Coral',180,'A bright branch of soft coral.'],['blue-rock','Blue Reef Rock',140,'A cool blue rock for hiding places.'],['anemone','Anemone',260,'A swaying home for your clownfish.'],['treasure','Tiny Treasure Chest',380,'A little glint of lost treasure.'],['fan-coral','Fan Coral',320,'A tall fan-shaped coral.'],['seaweed','Seaweed Patch',120,'A patch of waving green seaweed.']];view.innerHTML=`<div class="tabPane"><div class="panel"><div class="sectionHead"><div><h2 class="panelTitle">05 / Aquarium Upgrades</h2><div class="muted">Make a bigger, brighter home for your collection.</div></div><span class="goldText">${money(state.money)}</span></div><div class="grid">${upgradeData.map(u=>{const lv=u.type==='capacity'?state.tankLevel-1:u.type==='background'?state.backgroundUnlocked:state.filterLevel;const cost=u.costs[lv];return `<div class="card"><div class="pixel">${u.type==='capacity'?'TANK EXPANSION':u.type==='background'?'NEW ENVIRONMENT':'EQUIPMENT'}</div><h3>${u.name}</h3><p>${u.desc}</p><p class="tiny muted">Current level: ${lv}${u.type==='capacity'?` · Capacity ${levelCapacity()}`:''}</p><button class="small primary" data-upgrade="${u.type}" ${cost&&state.money>=cost?'':'disabled'}>${cost?`Upgrade · ${money(cost)}`:'MAX LEVEL'}</button></div>`}).join('')}</div></div><div class="panel"><h2 class="panelTitle">Decorate your tank</h2><p class="muted">Buy a decoration, then click anywhere inside the aquarium to place it. Decorations are saved with your game.</p><div class="grid">${decor.map(([id,n,c,d])=>`<div class="card"><h3>${n}</h3><p>${d}</p><button class="small" data-decor="${id}" ${state.money>=c?'':'disabled'}>Buy & place · ${money(c)}</button></div>`).join('')}</div><div class="row between" style="margin-top:14px"><span class="muted">Placed decorations: ${state.placed.length}</span><button id="clearDecor" class="small danger" ${state.placed.length?'':'disabled'}>Remove all decorations</button></div></div><div class="panel"><h2 class="panelTitle">Your tank's appearance</h2><div class="row">${['Lagoon','Tropical Blue','Midnight Reef','Sea Garden'].map((n,i)=>`<button data-bg="${i}" class="small ${state.background===i?'primary':''}" ${i<=state.backgroundUnlocked?'':'disabled'}>${n}</button>`).join('')}</div></div></div>`;view.querySelectorAll('[data-upgrade]').forEach(b=>b.onclick=()=>buyUpgrade(b.dataset.upgrade));view.querySelectorAll('[data-decor]').forEach(b=>b.onclick=()=>{const d=decor.find(x=>x[0]===b.dataset.decor);if(!d||state.money<d[2])return;state.money-=d[2];placingDecoration=d[0];toast('READY TO DECORATE','Click a spot inside your aquarium.');currentTab='aquarium';render();});view.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{state.background=Number(b.dataset.bg);saveGame();render();});$('#clearDecor').onclick=()=>{if(confirm('Remove every placed decoration?')){state.placed=[];saveGame();render();}};}
function buyUpgrade(type){let u=upgradeData.find(x=>x.type===type);let lv=type==='capacity'?state.tankLevel-1:type==='background'?state.backgroundUnlocked:state.filterLevel;const cost=u.costs[lv];if(!cost||state.money<cost)return;state.money-=cost;if(type==='capacity')state.tankLevel++;if(type==='background'){state.backgroundUnlocked++;state.background=state.backgroundUnlocked;}if(type==='filter')state.filterLevel++;toast('UPGRADE COMPLETE',u.name+' improved.');playSound('buy');saveGame();render();}
function renderStatistics(){const ach=achievementDefs;view.innerHTML=`<div class="tabPane"><div class="panel"><h2 class="panelTitle">06 / Aquarium Statistics</h2><div class="grid">${[['Lifetime earnings',money(state.lifetime)],['Total fish discovered',fmt(state.totalDiscoveries)],['Species discovered',`${discoveredCount()}/50`],['Fish currently owned',fmt(fishCount())],['Variants recorded',Object.values(state.variantsFound).reduce((n,o)=>n+Object.values(o).filter(Boolean).length,0)],['Playtime',formatTime(state.playSeconds)],['Packages opened',fmt(state.packageHistory)],['Current income',currentIncome().toFixed(2)+' / sec']].map(([l,v])=>`<div class="card"><p class="muted">${l}</p><h3 class="goldText">${v}</h3></div>`).join('')}</div></div><div class="panel"><div class="sectionHead"><h2 class="panelTitle">Achievements</h2><span class="badge">${state.achievements.length}/${ach.length} UNLOCKED</span></div><div class="grid">${ach.map(a=>{const got=state.achievements.includes(a.id);return `<div class="card achievement ${got?'':'locked'}"><div class="row between"><h3>${a.name}</h3><span>${got?'◆':'◇'}</span></div><p>${a.desc}</p><p class="goldText tiny">Reward: ${money(a.reward)}</p><span class="badge">${got?'UNLOCKED':'LOCKED'}</span></div>`}).join('')}</div></div></div>`;}
const achievementDefs=[{id:'first-friend',name:'First Friend',desc:'Adopt your first fish.',reward:100,check:()=>fishCount()>=1},{id:'reef-five',name:'Little School',desc:'Discover 5 different species.',reward:200,check:()=>discoveredCount()>=5},{id:'reef-ten',name:'Reef Regular',desc:'Discover 10 different species.',reward:350,check:()=>discoveredCount()>=10},{id:'reef-twenty',name:'Reef Explorer',desc:'Discover 20 different species.',reward:700,check:()=>discoveredCount()>=20},{id:'reef-thirty',name:'Aquarium Curator',desc:'Discover 30 different species.',reward:1200,check:()=>discoveredCount()>=30},{id:'reef-fifty',name:'The Whole Ocean',desc:'Discover all 50 species.',reward:5000,check:()=>discoveredCount()>=50},{id:'first-shiny',name:'Shiny Surprise',desc:'Find a Shiny variant.',reward:300,check:()=>hasVariant('Shiny')},{id:'golden',name:'Midas Touch',desc:'Find a Golden variant.',reward:500,check:()=>hasVariant('Golden')},{id:'iridescent',name:'Prismatic',desc:'Find an Iridescent variant.',reward:700,check:()=>hasVariant('Iridescent')},{id:'shadow',name:'Deep Shadow',desc:'Find a Shadow variant.',reward:900,check:()=>hasVariant('Shadow')},{id:'legendary',name:'Legendary Reef',desc:'Discover a Legendary species.',reward:850,check:()=>species.some(s=>s.rarity==='Legendary'&&state.discovered[s.id])},{id:'mythical',name:'Once in a Blue Moon',desc:'Discover a Mythical species.',reward:1600,check:()=>species.some(s=>s.rarity==='Mythical'&&state.discovered[s.id])},{id:'capacity',name:'Room to Grow',desc:'Upgrade your aquarium at least once.',reward:250,check:()=>state.tankLevel>=2},{id:'big-wallet',name:'Shell Collector',desc:'Earn 10,000 shells over time.',reward:500,check:()=>state.lifetime>=10000},{id:'first-expedition',name:'Far Horizons',desc:'Complete an expedition.',reward:300,check:()=>state.completedExpeditions>=1}];
function hasVariant(v){return Object.values(state.variantsFound).some(o=>o[v]);}
function checkAchievements(){for(const a of achievementDefs){if(!state.achievements.includes(a.id)&&a.check()){state.achievements.push(a.id);addMoney(a.reward);toast('ACHIEVEMENT UNLOCKED',`${a.name} · +${money(a.reward)}`);playSound('rare');}}}
function formatTime(sec){sec=Math.floor(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}h ${m}m`:m?`${m}m ${s}s`:`${s}s`;}
function renderSettings(){view.innerHTML=`<div class="tabPane"><div class="panel"><h2 class="panelTitle">07 / Settings</h2><div class="row between"><div><b>Sound effects</b><p class="muted tiny">Soft little chimes for purchases and discoveries.</p></div><button id="soundToggle" class="small ${state.settings.sound?'primary':''}">${state.settings.sound?'ON':'OFF'}</button></div><div class="divider" style="height:1px;background:#276f82;margin:12px 0"></div><div class="row between"><div><b>Animations</b><p class="muted tiny">Water shimmer, bubbles, fish sparkles and movement effects.</p></div><button id="animToggle" class="small ${state.settings.animations?'primary':''}">${state.settings.animations?'ON':'OFF'}</button></div></div><div class="panel"><h2 class="panelTitle">Variant odds</h2><p class="muted">Set the denominator for each special variant. For example, 100 means a 1 in 100 chance. Odds are rolled independently for every new fish; a fish can receive only one variant.</p><div class="grid">${Object.entries(defaultOdds).map(([v,d])=>`<label class="card"><b>${v}</b><p class="tiny muted">1 in</p><input class="settingsInput" type="number" min="1" max="1000000" id="odds-${v}" value="${state.settings.odds[v]||d}" style="width:100%"></label>`).join('')}</div><button id="saveOdds" class="primary" style="margin-top:12px">Save variant odds</button></div><div class="panel"><h2 class="panelTitle">Save data</h2><div class="row"><button id="saveNow">Save now</button><button id="exportSave">Export save</button><label class="small" style="background:#12627a;border:2px solid #56c5c6;padding:7px 10px;cursor:pointer">Import save<input type="file" id="importSave" accept="application/json" style="display:none"></label></div><p class="muted tiny">Your progress is stored locally in this browser. Export a backup before clearing browser data.</p><button id="resetGame" class="danger">Reset all progress</button></div></div>`;$('#soundToggle').onclick=()=>{state.settings.sound=!state.settings.sound;saveGame();render();};$('#animToggle').onclick=()=>{state.settings.animations=!state.settings.animations;saveGame();render();};$('#saveOdds').onclick=()=>{for(const v of Object.keys(defaultOdds)){const n=Math.max(1,Math.min(1000000,Math.floor(Number($('#odds-'+v).value)||defaultOdds[v])));state.settings.odds[v]=n;}saveGame();toast('ODDS UPDATED','Your new variant odds are active.');render();};$('#saveNow').onclick=()=>{saveGame();toast('GAME SAVED','Your reef is safe.');};$('#exportSave').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='little-reef-save.json';a.click();URL.revokeObjectURL(a.href);};$('#importSave').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const p=JSON.parse(await f.text());if(!p||!Array.isArray(p.fish)||typeof p.money!=='number')throw new Error('Invalid save');if(confirm('Replace your current aquarium with this save?')){state={...freshState(),...p,settings:{...freshState().settings,...p.settings,odds:{...defaultOdds,...p.settings?.odds}}};saveGame();render();toast('SAVE IMPORTED','Welcome back to your reef.');}}catch(err){toast('IMPORT FAILED','That file does not look like a Little Reef save.');}};$('#resetGame').onclick=()=>{if(confirm('Reset your entire aquarium? This will permanently delete your local save.')){if(confirm('Are you absolutely sure? There is no undo.')){localStorage.removeItem(SAVE_KEY);state=freshState();placingDecoration=null;render();toast('A FRESH START','Your new aquarium is ready.');}}};}

// NAVIGATION AND GAME LOOP -------------------------------------
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(!b)return;currentTab=b.dataset.tab;placingDecoration=null;render();});
function tick(){const now=Date.now(),dt=Math.max(0,(now-lastTick)/1000);lastTick=now;if(dt>0){const earn=currentIncome()*dt;addMoney(earn);state.playSeconds+=dt;state.cleanliness=Math.max(0,state.cleanliness-dt*(state.filterLevel?0.018:0.035));state.food=Math.max(0,state.food-dt*.045);if(state.feedBuff>0)state.feedBuff=Math.max(0,state.feedBuff-dt);if(state.cleanBuff>0)state.cleanBuff=Math.max(0,state.cleanBuff-dt);if(state.expedition){state.expedition.remaining-=dt;if(state.expedition.remaining<=0)finishExpedition();}checkAchievements();}if(now-lastSave>12000){saveGame();lastSave=now;}updateHud();if(currentTab==='aquarium'&&$('#expeditionTimer')&&state.expedition)$('#expeditionTimer').textContent=Math.ceil(state.expedition.remaining)+'s';if(currentTab==='discoveries'&&$('#expeditionTimer')&&state.expedition)$('#expeditionTimer').textContent=Math.ceil(state.expedition.remaining)+'s';}
let frame=0;function animate(now){if(currentTab==='aquarium'&&tankCtx){const dt=Math.min(.05,(now-frame)/1000||0);updateFish(dt,now/1000);renderTank(now/1000);}frame=now;requestAnimationFrame(animate);}
// Start aquarium and restore small randomized fish movement state.
state.fish.forEach(f=>{if(!Number.isFinite(f.x))f.x=100+Math.random()*700;if(!Number.isFinite(f.y))f.y=100+Math.random()*280;if(!Number.isFinite(f.vx))f.vx=(Math.random()-.5)*35;if(!Number.isFinite(f.vy))f.vy=(Math.random()-.5)*15;});
render();setInterval(tick,250);requestAnimationFrame(animate);window.addEventListener('beforeunload',saveGame);
</script>
</body>
</html>
